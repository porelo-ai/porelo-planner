# Saves the local Maven repository under the run's key when the job fetched an artifact the restored cache lacked,
# and only then: a run that fetched nothing saves no copy that would only crowd out the other caches.
name: Maven cache, saved
description: Saves ~/.m2/repository under the given key when the job added a jar or pom after the cache was restored, as fetched.sh tells.
inputs:
    key:
        description: The key the pinned-jdk action restored under, its output maven-cache-key.
        required: true
runs:
    using: composite
    steps:
        - id: fetched
          # Status functions inside a composite action can follow the job's state, so every step says always().
          if: always()
          shell: bash
          env:
              KEY: ${{ inputs.key }}
          run: |
              found=unrestored
              if [[ -n $KEY ]]; then
                  found=$(bash "$GITHUB_ACTION_PATH/fetched.sh" ~/.m2/repository "$RUNNER_TEMP/maven-cache-restored")
              fi
              case $found in
                  fetched*)
                      echo "${found}, among others: saved"
                      echo "save=true" >>"$GITHUB_OUTPUT"
                      ;;
                  *)
                      echo "${found} after the restore: nothing saved"
                      echo "save=false" >>"$GITHUB_OUTPUT"
                      ;;
              esac

        - if: always() && steps.fetched.outputs.save == 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.m2/repository
              key: ${{ inputs.key }}
