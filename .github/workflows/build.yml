# Builds the planner on every change to it: compiled, its tests run, its native executable built, held to x86-64 v1,
# started once and packed as a .deb and an .rpm, which put it where the window finds it. A push to main publishes them
# to the snapshots channel, a tag v<version> to the releases channel; a release depends only on releases.
name: Build

on:
    push:
        branches: [main]
        tags: ['v*']
        # A change to documents alone is checked locally before the hand-over and by the Shared rules check once a day.
        # Workflows alone build nothing either: an action's move is checked by its pull request, and the next push with
        # content builds with it.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', 'mkdocs.yml', '.github/**', 'porelo.yml']
    pull_request:
        # The image a Porelo task builds in changes no build here, and a workflow-only change is the Workflow check's.
        paths-ignore: ['porelo.yml', '.github/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build, packages and publish
        # Pinned, not ubuntu-latest: the packages' C library floor is measured on what this builds.
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # The runner image's own packages, kept per image, so the Ubuntu archive being down does not stop a build.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/porelo-apt/rpm
                  key: apt-rpm-${{ env.ImageVersion }}

            # check-package-version reads the built .rpm with rpm, which the runner is not promised to have.
            - name: rpm, to read the built package
              run: |
                  set -eu
                  cache="$HOME/.cache/porelo-apt/rpm"
                  if compgen -G "$cache/*.deb" >/dev/null && sudo dpkg -i "$cache"/*.deb; then
                      exit 0
                  fi
                  rm -rf "$cache"
                  mkdir -p "$cache"
                  if sudo apt-get update -qq \
                      && packages="$(LC_ALL=C apt-get -s install rpm | awk '/^Inst / {print $2}')" \
                      && [ -n "$packages" ] \
                      && (cd "$cache" && apt-get download $packages) \
                      && compgen -G "$cache/*.deb" >/dev/null \
                      && sudo dpkg -i "$cache"/*.deb; then
                      exit 0
                  fi
                  rm -rf "$cache"
                  sudo apt-get update -qq && sudo apt-get install -y -qq rpm

            # Not -DskipTests: the native start test needs the executable, and the dist profile's checks need it and
            # the packages it is packed into - the C library and zlib both declare, and the version both carry.
            - name: Build, tests, the native executable, its checks and its packages
              run: ./mvnw -B -U -s settings.xml -Pnative,dist verify -Dplanner.snapshot.run=${{ github.run_number }}

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries, with the executable the step above built. A tag checks the commit it names. A new branch or a branch pushed over has no start
            # this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  planner/app/target/porelo-planner check-commits "$start..$GITHUB_SHA"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      planner/app/target/*.deb
                      planner/app/target/*.rpm
                  if-no-files-found: error

            - name: Not publishing
              if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              run: |
                  echo "Not publishing. This run is '${{ github.event_name }}' on '${{ github.ref }}', and only a push to main"
                  echo "or a tag v<version> publishes. The packages were built and checked here and are attached to this run."

            # A tag publishes a release, main a snapshot. A release is refused unless the tag is exactly 'v' plus the version
            # it carries, and a version is never both at once.
            - name: Which channel
              id: channel
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml -N help:evaluate -Dexpression=project.version -DforceStdout)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "  $VERSION -> $(grep '^channel=' "$GITHUB_OUTPUT")"

            # Every -SNAPSHOT in the effective pom - dependencies, the imported BOM, plugins and their dependencies such as
            # porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  # -Pall: check-releases refuses an effective pom that leaves out a profile's module, here screen.
                  ./mvnw -B -s settings.xml -Pall help:effective-pom -Doutput=target/effective-pom.xml
                  ./mvnw -B -s settings.xml -N exec:exec@check-releases

            # Curl alone, so no downloaded tool runs beside the token; the token reaches it as config on standard input,
            # so neither a file nor a command line holds it. A .deb without its properties is stored and never indexed.
            - name: Publish the packages
              id: publish
              timeout-minutes: 5
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
                  VERSION: ${{ steps.channel.outputs.version }}
              run: |
                  set -euo pipefail
                  case "$JF_URL" in
                      https://?*) ;;
                      *) echo "::error::variable JF_URL is '$JF_URL', not an https:// address the token may go to"; exit 1 ;;
                  esac
                  base="${JF_URL%/}/artifactory"
                  # A glob that matches several files would shift put's arguments and upload the wrong thing.
                  only() {
                      [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one package, matched: $*" >&2; exit 1; }
                      echo "$1"
                  }
                  deb="$(only planner/app/target/*.deb)"
                  rpm="$(only planner/app/target/*.rpm)"
                  # The executable takes the version its packages carry, which the build gives a snapshot per run; the
                  # project version alone would land every snapshot on one path.
                  FILES="$(basename "$deb")"
                  FILES="${FILES#porelo-planner_}"
                  FILES="${FILES%_amd64.deb}"
                  # Bound to this run, so no package of another run, or of another form, lands under this build's name.
                  case "$CHANNEL" in
                      releases) want="$VERSION" ;;
                      snapshots) want="${VERSION%-SNAPSHOT}~snapshot.${GITHUB_RUN_NUMBER}" ;;
                      *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
                  esac
                  [ "$FILES" = "$want" ] \
                      || { echo "::error::the package version '$FILES' is not $want, this run's on $CHANNEL"; exit 1; }
                  [[ "$FILES" =~ ^[0-9]+\.[0-9]+\.[0-9]+(~snapshot\.[0-9]+)?$ ]] \
                      || { echo "::error::the package version '$FILES' is not x.y.z or x.y.z~snapshot.N"; exit 1; }
                  [ "$CHANNEL" = snapshots ] || [[ "$FILES" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                      || { echo "::error::a release's version '$FILES' is not x.y.z"; exit 1; }
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
                  # Other repositories' CI pins the executable by this path, its version and its SHA-256, a snapshot's too.
                  exe="$RUNNER_TEMP/porelo-planner-${FILES}-linux-x86_64"
                  cp planner/app/target/porelo-planner "$exe"
                  # A published release is never replaced, as on Central: each file is asked for where it would be
                  # stored, so one uploaded by a run that failed before its index was written counts too. Anything
                  # but a 404 stops the release, since whether it is published is then unknown.
                  absent() {
                      local status
                      # Anonymous, so the redirect Artifactory answers a stored file with may be followed.
                      status="$(curl -sSL -o /dev/null -w '%{http_code}' --retry 5 --proto =https --proto-redir =https --max-time 60 "$base/$1")"
                      case "$status" in
                          404) ;;
                          200) echo "::error::$1 is published already"; exit 1 ;;
                          *) echo "::error::asking for $1 answered $status, so whether it is published is unknown"; exit 1 ;;
                      esac
                  }
                  if [ "$CHANNEL" = releases ]; then
                      absent "porelo-dist-deb/pool/main/p/porelo-planner/$(basename "$deb")"
                      absent "porelo-dist-rpm/releases/$(basename "$rpm")"
                  fi
                  # A pinned executable is never replaced, a snapshot's neither: its version names one run.
                  absent "files/porelo-planner/${FILES}/$(basename "$exe")"
                  [ -n "$JF_ACCESS_TOKEN" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
                  # Assigned first, so a checksum that cannot be computed stops here instead of sending an empty header,
                  # which curl drops; Artifactory checks the bytes against both. Only a 2xx is an upload, and a redirect
                  # is not followed, so the token stays with this host. No -f: a refusal such as 401 is reported with
                  # its status at once, and only a timeout or a 408, 429 or 5xx is tried again.
                  put() {
                      local sha1 sha256 status
                      sha1="$(sha1sum "$1" | cut -d' ' -f1)"
                      sha256="$(sha256sum "$1" | cut -d' ' -f1)"
                      echo "  put   $2$(basename "$1")"
                      status="$(printf 'header = "Authorization: Bearer %s"\n' "$JF_ACCESS_TOKEN" \
                          | curl -sS --retry 5 --proto =https --max-time 120 -K - -o /dev/null -w '%{http_code}' -T "$1" \
                              -H "X-Checksum-Sha1: $sha1" -H "X-Checksum-Sha256: $sha256" \
                              "$base/$2$(basename "$1")${3:+;$3}")"
                      case "$status" in
                          2??) ;;
                          *) echo "::error::Artifactory answered $status to the upload of $(basename "$1"), not a 2xx"; exit 1 ;;
                      esac
                  }
                  put "$deb" "porelo-dist-deb/pool/main/p/porelo-planner/" \
                      "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  put "$rpm" "porelo-dist-rpm/${CHANNEL}/"
                  put "$exe" "files/porelo-planner/${FILES}/"

            # Uploaded is not installable. Read anonymously, as an installer sees it, into a variable before grep: grep
            # leaving a pipe early would fail curl under pipefail on a large index.
            - name: The packages are indexed, not merely stored
              timeout-minutes: 12
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  index="${JF_URL%/}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages"
                  set -- planner/app/target/*.deb
                  [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one package, matched: $*"; exit 1; }
                  DEB="$(basename "$1")"
                  tries=0
                  indexed=false
                  while [ "$tries" -lt 20 ]; do
                      if packages="$(curl -sSfL --proto =https --proto-redir =https --max-time 10 "$index" 2>"$RUNNER_TEMP/index-error")"; then
                          if grep -qxF "Filename: pool/main/p/porelo-planner/$DEB" <<< "$packages"; then
                              echo "  OK    the Debian index lists $DEB"
                              indexed=true
                              break
                          fi
                          last="the index does not list it"
                      else
                          last="$(cat "$RUNNER_TEMP/index-error")"
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$indexed" != true ]; then
                      echo "::error::$DEB is not in $index after $tries reads; the last: $last"
                      exit 1
                  fi
                  # The RPM index names its primary list in repomd.xml, under a new name for each calculation.
                  rpmrepo="${JF_URL%/}/artifactory/porelo-dist-rpm/${CHANNEL}"
                  set -- planner/app/target/*.rpm
                  [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one rpm, matched: $*"; exit 1; }
                  RPM="$(basename "$1")"
                  tries=0
                  indexed=false
                  while [ "$tries" -lt 20 ]; do
                      if repomd="$(curl -sSfL --proto =https --proto-redir =https --max-time 10 "$rpmrepo/repodata/repomd.xml" 2>"$RUNNER_TEMP/index-error")"; then
                          primary="$(grep -o 'repodata/[^"]*primary\.xml\.gz' <<< "$repomd" | head -1)"
                          if [ -z "$primary" ]; then
                              last="repomd.xml names no primary list"
                          elif curl -sSfL --proto =https --proto-redir =https --max-time 30 -o "$RUNNER_TEMP/primary.xml.gz" "$rpmrepo/$primary" 2>"$RUNNER_TEMP/index-error"; then
                              if gunzip -c "$RUNNER_TEMP/primary.xml.gz" | grep -qF "<location href=\"$RPM\""; then
                                  echo "  OK    the RPM index lists $RPM"
                                  indexed=true
                                  break
                              fi
                              last="the index does not list it"
                          else
                              last="$(cat "$RUNNER_TEMP/index-error")"
                          fi
                      else
                          last="$(cat "$RUNNER_TEMP/index-error")"
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$indexed" != true ]; then
                      echo "::error::$RPM is not in $rpmrepo after $tries reads; the last: $last"
                      exit 1
                  fi

            # Stored is not proof: the executable is read back anonymously, as another repository's CI reads it, and
            # its digest is the built file's.
            - name: The executable is published
              timeout-minutes: 3
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  VERSION: ${{ steps.publish.outputs.files }}
              run: |
                  set -euo pipefail
                  name="porelo-planner-${VERSION}-linux-x86_64"
                  url="${JF_URL%/}/artifactory/files/porelo-planner/${VERSION}/$name"
                  built="$(sha256sum planner/app/target/porelo-planner | cut -d' ' -f1)"
                  tries=0
                  read=false
                  while [ "$tries" -lt 10 ]; do
                      if curl -sSfL --proto =https --proto-redir =https --max-time 60 -o "$RUNNER_TEMP/$name.read" "$url" 2>"$RUNNER_TEMP/read-error"; then
                          read=true
                          break
                      fi
                      last="$(cat "$RUNNER_TEMP/read-error")"
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$read" != true ]; then
                      echo "::error::$url could not be read after $tries tries; the last: $last"
                      exit 1
                  fi
                  got="$(sha256sum "$RUNNER_TEMP/$name.read" | cut -d' ' -f1)"
                  if [ "$got" != "$built" ]; then
                      echo "::error::$url has SHA-256 $got; the built executable has $built"
                      exit 1
                  fi
                  echo "  OK    $url reads back with SHA-256 $built"
                  {
                      echo "### The planner's executable for the CI"
                      echo
                      echo "- version: \`$VERSION\`"
                      echo "- path: \`files/porelo-planner/${VERSION}/$name\`"
                      echo "- sha256: \`$built\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    # The window's planning screen, a Flutter package: analysed and tested as the window's build does it, with the
    # Flutter its pubspec pins. Only the screen's module: the Java build is the job above.
    screen:
        name: The planning screen
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version-file: screen/pubspec.yaml
                  cache: true

            # Maven drives Flutter, so the runner needs a JDK as well: the pinned one.
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            - name: The screen's analysis and tests
              run: ./mvnw -B -U -s settings.xml -Pall -pl screen verify

