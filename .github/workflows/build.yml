# Builds the planner on every change to it: compiled, its tests run, its native executable built, held to x86-64 v1,
# started once and packed as a .deb and an .rpm, which put it where the window finds it; and, except on a pull request,
# the same for Windows, packed as a ZIP and an MSIX. A push to main publishes them to the snapshots channel, a tag
# v<version> to the releases channel; a release depends only on releases.
name: Build

on:
    push:
        branches: [main]
        tags: ['v*']
        # A change to documents alone is checked locally before the hand-over and by the Shared rules check once a day.
        # Workflows alone build nothing either: an action's move is checked by its pull request, and the next push with
        # content builds with it.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', 'mkdocs.yml', '.github/**', 'porelo.yml']
    pull_request:
        # The image a Porelo task builds in changes no build here, and a workflow-only change is the Workflow check's.
        paths-ignore: ['porelo.yml', '.github/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build, packages and publish
        # Pinned, not ubuntu-latest: the packages' C library floor is measured on what this builds.
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        # For the Windows packages' own publishing job, which publishes what this job's checks let through.
        outputs:
            channel: ${{ steps.channel.outputs.channel }}
            version: ${{ steps.channel.outputs.version }}
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # The runner image's own packages, kept per image, so the Ubuntu archive being down does not stop a build.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/porelo-apt/rpm
                  key: apt-rpm-${{ env.ImageVersion }}

            # check-package-version reads the built .rpm with rpm, which the runner is not promised to have.
            - name: rpm, to read the built package
              run: |
                  set -eu
                  cache="$HOME/.cache/porelo-apt/rpm"
                  if compgen -G "$cache/*.deb" >/dev/null && sudo dpkg -i "$cache"/*.deb; then
                      exit 0
                  fi
                  rm -rf "$cache"
                  mkdir -p "$cache"
                  if sudo apt-get update -qq \
                      && packages="$(LC_ALL=C apt-get -s install rpm | awk '/^Inst / {print $2}')" \
                      && [ -n "$packages" ] \
                      && (cd "$cache" && apt-get download $packages) \
                      && compgen -G "$cache/*.deb" >/dev/null \
                      && sudo dpkg -i "$cache"/*.deb; then
                      exit 0
                  fi
                  rm -rf "$cache"
                  sudo apt-get update -qq && sudo apt-get install -y -qq rpm

            # Not -DskipTests: the native start test needs the executable, and the dist profile's checks need it and
            # the packages it is packed into - the C library and zlib both declare, and the version both carry.
            - name: Build, tests, the native executable, its checks and its packages
              run: ./mvnw -B -U -s settings.xml -Pnative,dist verify -Dplanner.snapshot.run=${{ github.run_number }}

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries, with the executable the step above built. A tag checks the commit it names. A new branch or a branch pushed over has no start
            # this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  planner/app/target/porelo-planner check-commits "$start..$GITHUB_SHA"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      planner/app/target/*.deb
                      planner/app/target/*.rpm
                  if-no-files-found: error

            - name: Not publishing
              if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              run: |
                  echo "Not publishing. This run is '${{ github.event_name }}' on '${{ github.ref }}', and only a push to main"
                  echo "or a tag v<version> publishes. The packages were built and checked here and are attached to this run."

            # A tag publishes a release, main a snapshot. A release is refused unless the tag is exactly 'v' plus the version
            # it carries, and a version is never both at once.
            - name: Which channel
              id: channel
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml -N help:evaluate -Dexpression=project.version -DforceStdout)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "  $VERSION -> $(grep '^channel=' "$GITHUB_OUTPUT")"

            # Every -SNAPSHOT in the effective pom - dependencies, the imported BOM, plugins and their dependencies such as
            # porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  # -Pall: check-releases refuses an effective pom that leaves out a profile's module, here screen.
                  ./mvnw -B -s settings.xml -Pall help:effective-pom -Doutput=target/effective-pom.xml
                  ./mvnw -B -s settings.xml -N exec:exec@check-releases

            # tool/artifactory.sh says how the token reaches curl and when a file counts as published. A .deb without its
            # properties is stored and never indexed.
            - name: Publish the packages
              id: publish
              timeout-minutes: 5
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
                  VERSION: ${{ steps.channel.outputs.version }}
              run: |
                  set -euo pipefail
                  case "$JF_URL" in
                      https://?*) ;;
                      *) echo "::error::variable JF_URL is '$JF_URL', not an https:// address the token may go to"; exit 1 ;;
                  esac
                  base="${JF_URL%/}/artifactory"
                  # A glob that matches several files would shift put's arguments and upload the wrong thing.
                  only() {
                      [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one package, matched: $*" >&2; exit 1; }
                      echo "$1"
                  }
                  deb="$(only planner/app/target/*.deb)"
                  rpm="$(only planner/app/target/*.rpm)"
                  # The executable takes the version its packages carry, which the build gives a snapshot per run; the
                  # project version alone would land every snapshot on one path.
                  FILES="$(basename "$deb")"
                  FILES="${FILES#porelo-planner_}"
                  FILES="${FILES%_amd64.deb}"
                  # Bound to this run, so no package of another run, or of another form, lands under this build's name.
                  case "$CHANNEL" in
                      releases) want="$VERSION" ;;
                      snapshots) want="${VERSION%-SNAPSHOT}~snapshot.${GITHUB_RUN_NUMBER}" ;;
                      *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
                  esac
                  [ "$FILES" = "$want" ] \
                      || { echo "::error::the package version '$FILES' is not $want, this run's on $CHANNEL"; exit 1; }
                  [[ "$FILES" =~ ^[0-9]+\.[0-9]+\.[0-9]+(~snapshot\.[0-9]+)?$ ]] \
                      || { echo "::error::the package version '$FILES' is not x.y.z or x.y.z~snapshot.N"; exit 1; }
                  [ "$CHANNEL" = snapshots ] || [[ "$FILES" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                      || { echo "::error::a release's version '$FILES' is not x.y.z"; exit 1; }
                  echo "files=$FILES" >> "$GITHUB_OUTPUT"
                  # Other repositories' CI pins the executable by this path, its version and its SHA-256, a snapshot's too.
                  exe="$RUNNER_TEMP/porelo-planner-${FILES}-linux-x86_64"
                  cp planner/app/target/porelo-planner "$exe"
                  . tool/artifactory.sh
                  if [ "$CHANNEL" = releases ]; then
                      absent "porelo-dist-deb/pool/main/p/porelo-planner/$(basename "$deb")"
                      absent "porelo-dist-rpm/releases/$(basename "$rpm")"
                  fi
                  # A pinned executable is never replaced, a snapshot's neither: its version names one run.
                  absent "porelo-files/porelo-planner/${FILES}/$(basename "$exe")"
                  [ -n "$JF_ACCESS_TOKEN" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
                  put "$deb" "porelo-dist-deb/pool/main/p/porelo-planner/" \
                      "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  put "$rpm" "porelo-dist-rpm/${CHANNEL}/"
                  put "$exe" "porelo-files/porelo-planner/${FILES}/"

            # Uploaded is not installable. Read anonymously, as an installer sees it, into a variable before grep: grep
            # leaving a pipe early would fail curl under pipefail on a large index.
            - name: The packages are indexed, not merely stored
              timeout-minutes: 12
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  index="${JF_URL%/}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages"
                  set -- planner/app/target/*.deb
                  [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one package, matched: $*"; exit 1; }
                  DEB="$(basename "$1")"
                  tries=0
                  indexed=false
                  while [ "$tries" -lt 20 ]; do
                      if packages="$(curl -sSfL --proto =https --proto-redir =https --max-time 10 "$index" 2>"$RUNNER_TEMP/index-error")"; then
                          if grep -qxF "Filename: pool/main/p/porelo-planner/$DEB" <<< "$packages"; then
                              echo "  OK    the Debian index lists $DEB"
                              indexed=true
                              break
                          fi
                          last="the index does not list it"
                      else
                          last="$(cat "$RUNNER_TEMP/index-error")"
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$indexed" != true ]; then
                      echo "::error::$DEB is not in $index after $tries reads; the last: $last"
                      exit 1
                  fi
                  # The RPM index names its primary list in repomd.xml, under a new name for each calculation.
                  rpmrepo="${JF_URL%/}/artifactory/porelo-dist-rpm/${CHANNEL}"
                  set -- planner/app/target/*.rpm
                  [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one rpm, matched: $*"; exit 1; }
                  RPM="$(basename "$1")"
                  tries=0
                  indexed=false
                  while [ "$tries" -lt 20 ]; do
                      if repomd="$(curl -sSfL --proto =https --proto-redir =https --max-time 10 "$rpmrepo/repodata/repomd.xml" 2>"$RUNNER_TEMP/index-error")"; then
                          primary="$(grep -o 'repodata/[^"]*primary\.xml\.gz' <<< "$repomd" | head -1)"
                          if [ -z "$primary" ]; then
                              last="repomd.xml names no primary list"
                          elif curl -sSfL --proto =https --proto-redir =https --max-time 30 -o "$RUNNER_TEMP/primary.xml.gz" "$rpmrepo/$primary" 2>"$RUNNER_TEMP/index-error"; then
                              if gunzip -c "$RUNNER_TEMP/primary.xml.gz" | grep -qF "<location href=\"$RPM\""; then
                                  echo "  OK    the RPM index lists $RPM"
                                  indexed=true
                                  break
                              fi
                              last="the index does not list it"
                          else
                              last="$(cat "$RUNNER_TEMP/index-error")"
                          fi
                      else
                          last="$(cat "$RUNNER_TEMP/index-error")"
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$indexed" != true ]; then
                      echo "::error::$RPM is not in $rpmrepo after $tries reads; the last: $last"
                      exit 1
                  fi

            # Stored is not proof: the executable is read back anonymously, as another repository's CI reads it, and
            # its digest is the built file's.
            - name: The executable is published
              timeout-minutes: 3
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  VERSION: ${{ steps.publish.outputs.files }}
              run: |
                  set -euo pipefail
                  name="porelo-planner-${VERSION}-linux-x86_64"
                  url="${JF_URL%/}/artifactory/porelo-files/porelo-planner/${VERSION}/$name"
                  built="$(sha256sum planner/app/target/porelo-planner | cut -d' ' -f1)"
                  tries=0
                  read=false
                  while [ "$tries" -lt 10 ]; do
                      if curl -sSfL --proto =https --proto-redir =https --max-time 60 -o "$RUNNER_TEMP/$name.read" "$url" 2>"$RUNNER_TEMP/read-error"; then
                          read=true
                          break
                      fi
                      last="$(cat "$RUNNER_TEMP/read-error")"
                      tries=$((tries + 1))
                      sleep 6
                  done
                  if [ "$read" != true ]; then
                      echo "::error::$url could not be read after $tries tries; the last: $last"
                      exit 1
                  fi
                  got="$(sha256sum "$RUNNER_TEMP/$name.read" | cut -d' ' -f1)"
                  if [ "$got" != "$built" ]; then
                      echo "::error::$url has SHA-256 $got; the built executable has $built"
                      exit 1
                  fi
                  echo "  OK    $url reads back with SHA-256 $built"
                  {
                      echo "### The planner's executable for the CI"
                      echo
                      echo "- version: \`$VERSION\`"
                      echo "- path: \`porelo-files/porelo-planner/${VERSION}/$name\`"
                      echo "- sha256: \`$built\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    # The executable for Windows, from the same commit: built and tested on GitHub's Windows runner, packed as a ZIP and
    # an MSIX that puts porelo-planner.exe on the PATH, and attested. Never on a pull request, which gets no token for
    # the attestation; a push to main or a tag signs and installs the MSIX, a dispatch packs it to prove it.
    windows:
        name: Windows
        if: github.event_name != 'pull_request'
        runs-on: windows-2025
        # Each step's limit bounds a hang of its own and this bounds the whole; the first run measures it.
        timeout-minutes: 60
        # The attestation's two, for this job only, as check-actions' list names them.
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            # The checks compare files byte for byte with their shared copies, which have LF line ends.
            - name: Check out with LF line ends
              run: git config --global core.autocrlf false

            # Without the job's token in .git/config: nothing here pushes with git.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.m2/repository
                  key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
                  restore-keys: maven-${{ runner.os }}-

            # By its exact key alone: mvnw.cmd checks distributionSha256Sum only when it downloads.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.m2/wrapper
                  key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

            # As the pinned-jdk action does on Linux, whose shfmt is a Linux one: porelo-machines, run by the runner's
            # Java 25, names the Windows zip's digest when it runs on Windows.
            - name: The shared build tools, and the pinned GraalVM's digest
              id: graalvm-pin
              timeout-minutes: 20
              shell: bash
              run: |
                  set -eu
                  . .github/actions/pinned-jdk/pinned.sh
                  [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25"; exit 1; }
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  pinned_retry "the wrapper's Maven" ./mvnw -B -q --version >/dev/null
                  sha256=$(./mvnw -B -q -U -s settings.xml -N exec:exec@machines -Dmachines.args="jdk --print-sha256") \
                      || {
                          echo "::error::porelo-machines could not name the pinned digest (exit $?)"
                          printf '%s\n' "$sha256"
                          exit 1
                      }
                  [[ $sha256 =~ ^[0-9a-f]{64}$ ]] || {
                      echo "::error::porelo-machines named no pinned digest"
                      printf '%s\n' "$sha256"
                      exit 1
                  }
                  echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

            # Only the archive, under its digest; porelo-machines checks a cached one against it again before unpacking.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: graalvm-cache
              with:
                  path: ~/.cache/porelo-pinned/graalvm
                  key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}

            - name: Install the pinned GraalVM
              timeout-minutes: 20
              shell: bash
              env:
                  # The job's token, for a download from https://github.com alone; none on a host's forge.
                  PORELO_PINNED_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
              run: |
                  set -eu
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  # A Windows path: the JVM reads no /c/ of Git's shell.
                  cache="$(cygpath -w "$HOME/.cache/porelo-pinned/graalvm")"
                  ./mvnw -B -q -s settings.xml -N exec:exec@machines -Dmachines.args="jdk --github --cache $cache"

            - if: steps.graalvm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/porelo-pinned/graalvm
                  key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}

            # The tests tagged windows, the native executable held to x86-64 v1, NativeStartIT on it but for the tests
            # tagged linux, and the ZIP held to its list and to that executable. The formatting is the Linux job's, where
            # shfmt and the checkout's line ends are the ones it checks.
            - name: Build, tests, the native executable, its checks and the ZIP
              timeout-minutes: 40
              shell: bash
              run: |
                  ./mvnw -B -U -s settings.xml -Pnative,windows verify -Dplanner.snapshot.run=${{ github.run_number }} \
                      -Dspotless.check.skip=true

            # The window's packing script and install check, which serve any package of Porelo's signer: taken from the
            # window's repository by commit, never kept here as a copy. Pinned to porelo-frontend's main at
            # "Show what a started alias said when the install check fails".
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: porelo-ai/porelo-frontend
                  ref: 661fa7e5b5265efd3d609d5ee09342df79bd2d92
                  path: window-tool
                  sparse-checkout: tool
                  persist-credentials: false

            # The MSIX from the ZIP as Maven packed it, its executable held to the tested one. The certificate reaches
            # this step alone, and only where the Build publishes, which then stops without it.
            - name: Pack the MSIX, signed where the Build publishes
              timeout-minutes: 10
              shell: pwsh
              env:
                  PORELO_SIGNING_REQUIRED: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
                  WINDOWS_SIGNING_PFX: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.WINDOWS_SIGNING_PFX || '' }}
                  WINDOWS_SIGNING_PFX_PASSWORD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.WINDOWS_SIGNING_PFX_PASSWORD || '' }}
              run: |
                  $zip = @(Get-ChildItem planner/app/target/windows/porelo-planner-*-windows-x64.zip)
                  if ($zip.Count -ne 1) { throw "Asked for one ZIP; got $($zip.Count)" }
                  $version = $zip[0].BaseName -replace '^porelo-planner-', '' -replace '-windows-x64$', ''
                  ./window-tool/tool/windows-package.ps1 -Zip $zip[0].FullName -Prefix porelo-planner -Version $version `
                      -Run ${{ github.run_number }} -Packaging planner/app/src/windows `
                      -TestedExecutable planner/app/target/porelo-planner.exe -Out planner/app/target/windows `
                      -RequireSigning:($env:PORELO_SIGNING_REQUIRED -eq 'true')

            # Started as the window starts it: by its alias on the PATH, from another process, in an empty working
            # directory; tool/windows-planner-ready.ps1 is the planner's own part, its planner.json and /health naming
            # this build's version and commit. The planner's own directory and the log directory it shares with the
            # window must not be there before, and are taken out after.
            - name: Install the MSIX and start the planner through the PATH
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              timeout-minutes: 10
              shell: pwsh
              env:
                  PORELO_PLANNER_COMMIT: ${{ github.sha }}
              run: |
                  $msix = @(Get-ChildItem planner/app/target/windows/*.msix)
                  if ($msix.Count -ne 1) { throw "Asked for one MSIX; got $($msix.Count)" }
                  $zip = @(Get-ChildItem planner/app/target/windows/porelo-planner-*-windows-x64.zip)
                  if ($zip.Count -ne 1) { throw "Asked for one ZIP; got $($zip.Count)" }
                  $env:PORELO_PLANNER_VERSION = $zip[0].BaseName -replace '^porelo-planner-', '' -replace '-windows-x64$', ''
                  ./window-tool/tool/windows-install-check.ps1 -Msix $msix[0].FullName `
                      -Cer planner/app/target/windows/porelo-msix.cer -ExpectedIdentity ai.porelo.planner `
                      -Alias porelo-planner.exe `
                      -ReadyScript tool/windows-planner-ready.ps1 `
                      -Leftovers (Join-Path $env:LOCALAPPDATA 'porelo-planner'), (Join-Path $env:LOCALAPPDATA 'porelo')

            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              id: attest
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              with:
                  subject-path: |
                      planner/app/target/windows/*.zip
                      planner/app/target/windows/*.msix

            # The Sigstore bundle beside the packages, one for both, so they can be checked from Artifactory alone:
            # `gh attestation verify <file> --bundle <name>.sigstore.json --repo porelo-ai/porelo-planner`.
            - name: Keep the attestation beside the packages
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              shell: pwsh
              env:
                  BUNDLE: ${{ steps.attest.outputs.bundle-path }}
              run: |
                  $zip = @(Get-ChildItem planner/app/target/windows/*.zip)
                  if ($zip.Count -ne 1) { throw "Asked for one ZIP; got $($zip.Count)" }
                  Copy-Item -LiteralPath $env:BUNDLE "planner/app/target/windows/$($zip[0].BaseName).sigstore.json"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows
                  path: |
                      planner/app/target/windows/*.zip
                      planner/app/target/windows/*.msix
                      planner/app/target/windows/*.cer
                      planner/app/target/windows/*.sigstore.json
                      planner/app/target/windows/SHA256SUMS
                  if-no-files-found: error

    # The Windows packages, published once the Build's own checks and the Windows job have passed, so a red Windows job
    # never holds back the Linux packages; a rerun of the failed jobs publishes them for the same run.
    windows-publish:
        name: Publish the Windows packages
        needs: [build, windows]
        if: >-
            github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
            && needs.build.result == 'success' && needs.windows.result == 'success'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            CHANNEL: ${{ needs.build.outputs.channel }}
            VERSION: ${{ needs.build.outputs.version }}
        steps:
            # For tool/artifactory.sh alone; without the job's token in .git/config.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: windows
                  path: ${{ runner.temp }}/windows

            # Exactly the names this run's version gives, plain files each, and SHA256SUMS over exactly the packages:
            # nothing else in the artifact reaches a URL.
            - name: The expected files and nothing else
              id: files
              run: |
                  set -euo pipefail
                  case "$CHANNEL:$VERSION" in
                      releases:*-SNAPSHOT | snapshots:*[!T] | :* | *:) echo "::error::channel '$CHANNEL' and version '$VERSION' do not go together"; exit 1 ;;
                  esac
                  [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::version '$VERSION' is not x.y.z[-SNAPSHOT]"; exit 1; }
                  package="${VERSION%-SNAPSHOT}"
                  [ "$package" = "$VERSION" ] || package="$package~snapshot.$GITHUB_RUN_NUMBER"
                  name="porelo-planner-$package-windows-x64"
                  dir="$RUNNER_TEMP/windows"
                  expected="$(printf '%s\n' SHA256SUMS porelo-msix.cer "$name.msix" "$name.sigstore.json" "$name.zip" | LC_ALL=C sort)"
                  actual="$(find "$dir" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
                  [ "$actual" = "$expected" ] || {
                      echo "::error::the artifact holds other files than this version's"
                      printf 'expected:\n%s\nreceived:\n%s\n' "$expected" "$actual"
                      exit 1
                  }
                  while read -r file; do
                      [ -f "$dir/$file" ] && [ ! -L "$dir/$file" ] || { echo "::error::$file is not a plain file"; exit 1; }
                  done <<< "$expected"
                  summed="$(cut -d' ' -f3- "$dir/SHA256SUMS" | LC_ALL=C sort)"
                  [ "$summed" = "$(printf '%s\n' "$name.msix" "$name.zip" porelo-msix.cer | LC_ALL=C sort)" ] || {
                      echo "::error::SHA256SUMS names other files than the ZIP, the MSIX and the certificate: $summed"
                      exit 1
                  }
                  (cd "$dir" && sha256sum --strict -c SHA256SUMS)
                  echo "package=$package" >> "$GITHUB_OUTPUT"

            # A release's files are each asked for before the first goes up, so none is replaced; a snapshot's version
            # carries its run, so no run overwrites another's.
            - name: Publish the Windows packages
              timeout-minutes: 5
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  PACKAGE: ${{ steps.files.outputs.package }}
              run: |
                  set -euo pipefail
                  case "$JF_URL" in
                      https://?*) ;;
                      *) echo "::error::variable JF_URL is '$JF_URL', not an https:// address the token may go to"; exit 1 ;;
                  esac
                  base="${JF_URL%/}/artifactory"
                  . tool/artifactory.sh
                  target="porelo-dist-windows/porelo-planner/${CHANNEL}/${PACKAGE}/"
                  dir="$RUNNER_TEMP/windows"
                  if [ "$CHANNEL" = releases ]; then
                      for file in "$dir"/*; do
                          absent "$target$(basename "$file")"
                      done
                  fi
                  [ -n "$JF_ACCESS_TOKEN" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
                  for file in "$dir"/*; do
                      put "$file" "$target"
                  done

            # As a person fetches them: without a token, each compared with what went up.
            - name: The Windows packages read back without a token
              timeout-minutes: 5
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  PACKAGE: ${{ steps.files.outputs.package }}
              run: |
                  set -euo pipefail
                  url="${JF_URL%/}/artifactory/porelo-dist-windows/porelo-planner/${CHANNEL}/${PACKAGE}"
                  dir="$RUNNER_TEMP/windows"
                  for file in "$dir"/*; do
                      name="$(basename "$file")"
                      curl -sSfL --retry 5 --proto =https --proto-redir =https --max-time 120 -o "$RUNNER_TEMP/read-back" \
                          "$url/$name"
                      [ "$(sha256sum < "$RUNNER_TEMP/read-back" | cut -d' ' -f1)" = "$(sha256sum < "$file" | cut -d' ' -f1)" ] || {
                          echo "::error::$url/$name read back is not the file uploaded"
                          exit 1
                      }
                      echo "  OK    $name read back as uploaded"
                  done

    # The window's planning screen, a Flutter package: analysed and tested as the window's build does it, with the
    # Flutter its pubspec pins, and the screen's test app with it. Only those modules: the Java build is the job above.
    screen:
        name: The planning screen
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version-file: screen/pubspec.yaml
                  cache: true

            # Maven drives Flutter, so the runner needs a JDK as well: the pinned one.
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            - name: The screen's analysis and tests
              run: ./mvnw -B -U -s settings.xml -Pall -pl screen,screen-app verify

    # What only Windows shows of the screen: the planner's address file read through the real access control lists.
    # Flutter alone, without Maven: the rest of the screen is the job above's, and this job needs no JDK.
    screen-windows:
        name: The planning screen on Windows
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version-file: screen/pubspec.yaml
                  cache: true

            - name: The screen's tests tagged windows
              timeout-minutes: 15
              shell: bash
              working-directory: screen
              run: |
                  flutter pub get
                  flutter test --tags windows

