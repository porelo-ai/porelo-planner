      items:
        $ref: '#/components/schemas/IssueId'
    StoryWorkProposal:
      type: object
      required: [modes, repositories, coordinator, comment, readingRounds, issueReadingRounds, revision, manual, held]
      properties:
        modes:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/PlanRepositoryWork'
        coordinator:
          type: string
