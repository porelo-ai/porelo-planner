  /projects/{project}/stories/{story}/work:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: getStoryWork
      summary: Read the current run
      description: Returns null when no run is recorded; working states never recreate a lost record.
      tags: [work]
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'
    post:
      operationId: orderStoryWork
      summary: Prepare the tasks the window starts
      description: >-
        Recomputes the proposal and validates the window's choices against it. Checks the story against the version
        `seen` holds for it before recorded active work. Omitted repositories and limits take the proposal's defaults; an omitted comment is empty. Every
        repository and assignment must occur exactly once. Immutable proposal fields must match, KEEP retains the
        proposed agent and model, CHANGE selects an agent the rule offers for the issues' risk with any model that is
        a plain name (the rule's model is only the proposal), and DROP leaves the brief to the main task. The main
        task's agent and model are taken the same way. CHANGE and DROP need a nonblank comment. OTHER may only be dropped. No prompt comes from the body.
        Expands order placeholders once per task, with repository text delimited by longer backtick fences.
        Refuses any brief over 4000 characters or task prompt over 65536 UTF-8 bytes. The JSON body is at most 65536
        bytes. Persists scoped opaque offers before answering, without starting or moving anything. While the story's
        run holds offers not started yet, a Start must name that run in `replaces` and then replaces those offers;
        without `replaces` it is refused with the conflict RunChanged, so a replayed Start never gets a second set of
        offers to launch. `replaces` naming any other run than the one standing, or a run where none stands, is
        refused the same way. A `passOver` answers one issue's reason with a new run in place of the old one: it
        names the run, the issue and its reason (NEXT_STEP_UNAVAILABLE, SAVE_REFUSED, STOPPED or FAILED) as the
        person saw them, and is refused with RunChanged when the run, or that issue's reason, changed meanwhile, or
        when another issue of the run needs attention for another reason.
        BLOCKED is never passed over, since a blocked task said it cannot go on unless something changes. A
        `passOver` of any reason is refused with WorkNotAllowed while the last ended task of an issue the run raised
        reports commits unpushed, which only that task can push, and one of FAILED while the failure stopped a
        reading, which only a reading choice answers. A
        halted run takes a Start only with a `passOver` of its SAVE_REFUSED, recorded stopped and replaced in one
        step. A Start without `passOver` over a run any of whose issues holds a reason, a stopped run's STOPPED
        included, is refused with RunChanged whatever `replaces` names. The run named in `replaces` or `passOver` is
        checked against the one standing before anything else about it. Work at work, readings waiting for a choice, and lost working records refuse work; every added field is
        optional.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryWorkRequest'
      responses:
        '200':
          description: The tasks to pass individually to Porelo's Start, at the unchanged revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkOrder'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/WorkConflict'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

