    TrackedWork:
      type: object
      additionalProperties: false
      required: [issue, phase]
      properties:
        issue:
          type: string
          maxLength: 200
          pattern: '^(?![^#]*\.\.)[A-Za-z0-9][A-Za-z0-9._-]*/[a-z0-9][a-z0-9._-]{0,99}#[1-9][0-9]{0,8}$'
          description: >-
            The tracker's issue with its owner, `<owner>/<repository>#<number>`: one line without white space and
            without `..`, at most 200 characters.
        phase:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^(?=[\s\S]*\S)[^\u0000-\u001F\u007F-\u009F\u2028\u2029]+$'
          description: >-
            The name of the stage's phase the task works, one line that is not blank, at most 64 characters.

    GivenFile:
      type: object
      required: [name, text]
      properties:
        name:
          type: string
          pattern: '^([A-Z]{1,4}[0-9]{1,5}(\.[0-9]{1,3})?|(?!.*\.\.)[a-z0-9][a-z0-9._-]{0,99}-[1-9][0-9]{0,8})\.md$'
          description: >-
            The plain file name, an issue's id the task owns with .md; a tracker reference's `#` is written as `-`
            (`porelo-planner-12.md` for `porelo-planner#12`), so no file name Porelo mounts holds a `#`.
        text:
          type: string
          description: The issue's text, at most 65536 UTF-8 bytes.
    TaskLabel:
      type: string
