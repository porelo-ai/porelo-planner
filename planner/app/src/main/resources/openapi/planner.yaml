          maxLength: 4000
          description: The rule's order, expanded after the operator's final choices.
        effort:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: >-
            The effort chosen: the rule's for the issues' risk as proposed, or the person's as sent back; null for none.
            An open name, not an enum, since its values are Porelo's per agent.
        chosenBy:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: string
          description: >-
            Where the rule's choice of agent, model and effort came from, for example "Reading, risk harm"; the
            planner's words, which it never takes back from a caller. Empty when not known.
        offered:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: array
          description: >-
            Every agent the rule offers this task, each with the model it offers, in the rule's order, the proposed
            agent first, so a window can preselect the first one ready on the machine the task goes to. The
            planner's words, which it never takes back from a caller; absent where it names none, as in a run's
            record or from an older planner.
          items:
            $ref: '#/components/schemas/PlanOffer'
    PlanOffer:
      type: object
      additionalProperties: false
      required: [agent, model]
      properties:
