openapi: 3.1.0
info:
  title: Porelo Planner
  version: 1.0.0
  description: >-
    Serves a project's planning board - its workflow, stories and issues kept in Git - to the Porelo window on the
    same computer. Every call needs a bearer token; a missing or wrong token answers 401 with an empty body.
servers:
  - url: http://127.0.0.1
security:
  - bearer: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health
      description: Answers UP while the planner serves calls.
      tags: [health]
      responses:
        '200':
          description: The planner serves calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /log/level:
    get:
      operationId: getLogLevel
      summary: The log's level
      description: >-
        Answers the level of the planner's own log in force. Where the log lies is the address file's `log` field.
      tags: [log]
      responses:
        '200':
          description: The level in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putLogLevel
      summary: Set the log's level
      description: >-
        Sets the level of the planner's own log at once and keeps it, so it holds from the next start too. The
        planner's log takes only its own lines; a library's stay out of it at every level.
      tags: [log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Level'
      responses:
        '200':
          description: The level now in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
        '400':
          $ref: '#/components/responses/InvalidLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mock/reset:
    post:
      operationId: resetMock
      summary: Restore the mock board
      description: >-
        Only in the mock mode (`porelo-planner --mock`), for the window's tests: forgets every project given with the
        moves saved into its own copy of the mock board, so a project given again is served the mock board at
        `mock@1` and each test starts alike. Outside the mock mode a POST here
        answers 404, as for a path that does not exist.
      tags: [mock]
      responses:
        '204':
          description: The mock board is as it was at the start.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The planner does not run in the mock mode.

  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/Project'
    put:
      operationId: putProject
      summary: Name a project's repository
      description: >-
        Makes the project known with its own repository and branch; the same body again changes nothing. Another body
        retires the project first and drops its clones as the new one opens, so a failed call leaves the project
        unknown.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSource'
      responses:
        '204':
          description: The project is known with this repository and branch.
        '400':
          $ref: '#/components/responses/ProjectRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/TooManyProjects'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/workflow:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getWorkflow
      summary: Read the workflow
      description: Answers the project's states, phases, sound work rules and the faults found reading its workflow and board.
      tags: [board]
      responses:
        '200':
          description: The project's workflow at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/events:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getEvents
      summary: Follow the board's changes
      description: >-
        Streams the project's board as Server-Sent Events: event `board`, its `id` the board's revision and its
        `data` one `Board` object, first at once and then whenever the store revision or local work generation changes. Work-only
        changes retain the revision, including a cancellation or Needs you. Saves, polls and `refresh` publish the
        current board and work snapshot. A comment line `: keep-alive` comes every 15 s while nothing changes; a
        reader that falls behind gets only the newest board. A reconnect, with `Last-Event-ID` or without, gets the
        current board first. An unknown project is refused before the stream starts.
      tags: [board]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last event id the window saw; the current board comes first in any case.
          schema:
            type: string
      responses:
        '200':
          description: The stream of the project's boards; each event's data is a `Board`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/refresh:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: refreshProject
      summary: Read the repositories now
      description: >-
        Fetches the project's repositories at once instead of waiting for the next poll; a new revision reaches every
        stream of the project before this call answers.
      tags: [board]
      responses:
        '200':
          description: The revision after the fetch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refreshed'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listStories
      summary: List the stories
      description: Answers the project's stories with their issues, all of them or only those in the named states.
      tags: [board]
      parameters:
        - name: state
          in: query
          required: false
          description: A state whose stories are answered; repeated for several, and absent for all stories.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The stories at the given revision, without their descriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryList'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: getStory
      summary: Read one story
      description: Answers one story with its issues and its description.
      tags: [board]
      responses:
        '200':
          description: The story at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryReply'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/issues:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: listStoryIssues
      summary: List a story's issues
      description: Answers exactly the issues of one story.
      tags: [board]
      responses:
        '200':
          description: The story's issues at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/ideas/discussion:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: discussIdea
      summary: Offer a task that discusses an idea
      description: >-
        Answers one task for Porelo's Start that discusses an idea with the person: role DISCUSSION, no repository,
        no issues, mode AGENT, and as agent and model the first agent and model of the first sound work rule whose
        names are 1 to 128 UTF-16 code units, as defaults the person may change. The window starts it with every
        repository of the project read only, and the task hands back the file named by result, in the idea format
        the brief carries. Records, saves and announces nothing, and no task events are taken for its offer. The
        JSON body is at most 65536 bytes; the idea is 1 to 4000 characters and not blank, else InvalidSettings.
        NoDiscussion (reason) when no sound work rule offers an agent or the brief would exceed 65536 UTF-8 bytes.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaDiscussionRequest'
      responses:
        '200':
          description: The one task to pass to Porelo's Start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningStartTask'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/ideas:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: handIdea
      summary: Hand in the idea a discussion wrote
      description: >-
        Saves the idea a discussion's task wrote, which the window hands in with the discussion's offer when the task
        ends: one story in state Idea in the project's own repository and an issue in state Idea in each repository the
        idea names, in one save against the board the planner reads; the request carries no revision. The idea is
        checked before anything is saved, and a malformed idea makes nothing. One offer makes one story: a second
        hand-in of a saved offer answers the same story and writes nothing, even for another idea; a hand-in of an
        offer whose save is still pending or was only partly pushed is refused (IdeaRefused, naming the repositories
        already pushed) and writes nothing. The JSON body is at most 65536 bytes. The changes stream announces the new
        board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaRequest'
      responses:
        '201':
          description: The story and its issues are saved, by this hand-in or an earlier one of the same offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaAdded'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/IssueConflict'
        '422':
          $ref: '#/components/responses/IdeaRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/proposal:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    post:
      operationId: proposeStoryWork
      summary: Propose the tasks for a story
      description: >-
        Computes a proposal from one board and its sound work rule. The first mode and ordered model entry are the
        defaults. Only open issues and open sub-issues in their parent's repository participate. Each sub-issue has
        one BUILDER; reading belongs to the later run. Starts nothing and changes neither state nor revision.
        The JSON body is at most 65536 bytes. An unknown target state is InvalidSettings.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryWorkProposalRequest'
      responses:
        '200':
          description: The proposed tasks and defaults at this revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkProposal'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/WorkConflict'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/work:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: getStoryWork
      summary: Read the current run
      description: Returns null when no run is recorded; working states never recreate a lost record.
      tags: [work]
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'
    post:
      operationId: orderStoryWork
      summary: Prepare the tasks the window starts
      description: >-
        Recomputes the proposal and validates the window's choices against it. Checks revision before recorded active
        work. Omitted repositories and limits take the proposal's defaults; an omitted comment is empty. Every
        repository and assignment must occur exactly once. Immutable proposal fields must match, KEEP retains the
        proposed agent and model, CHANGE selects an offered agent/model pair, and DROP leaves the brief to the main
        task. CHANGE and DROP need a nonblank comment. OTHER may only be dropped. No prompt comes from the body.
        Expands order placeholders once per task, with repository text delimited by longer backtick fences.
        Refuses any brief over 4000 characters or task prompt over 65536 UTF-8 bytes. The JSON body is at most 65536
        bytes. Persists scoped opaque offers before answering, without starting or moving anything. Repeating this
        call replaces unstarted offers. Halted runs, readings waiting for a choice, and lost working records refuse work.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryWorkRequest'
      responses:
        '200':
          description: The tasks to pass individually to Porelo's Start, at the unchanged revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkOrder'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/WorkConflict'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues/{issue}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Issue'
    get:
      operationId: getIssue
      summary: Read one issue
      description: Answers one issue with its text, its sub-issues and its What must be true paragraph when it has one.
      tags: [board]
      responses:
        '200':
          description: The issue at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueReply'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchIssue'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues/{issue}/worker:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Issue'
    put:
      operationId: setWorker
      summary: Set who works an issue
      description: >-
        Writes the issue's worker into its head against the board at the given revision, saved as a move is saved: one
        commit pushed under the person's own Git login, or nothing at all. A worker equal to the issue's is saved as
        nothing. A sub-issue takes its parent's worker and is refused one of its own; an issue a task of a running work
        owns, itself or through one of its sub-issues, is refused, as a move of it is. An issue a person works is
        refused an agent while it or one of its sub-issues stands in a working state, which no task entered.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRequest'
      responses:
        '200':
          description: The worker is saved, or was the issue's already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSaved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchIssue'
        '409':
          $ref: '#/components/responses/MoveConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/priority:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    put:
      operationId: setPriority
      summary: Set a story's priority
      description: >-
        Writes the story's priority into its head against the board at the given revision, saved as a move is saved:
        the head and the stories index in one commit that starts no build, pushed under the person's own Git login, or
        nothing at all. A priority equal to the story's is saved as nothing and answers the current revision. The
        priority touches no issue, so it may change while the story's work runs.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityRequest'
      responses:
        '200':
          description: The priority is saved, or was the story's already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrioritySaved'
        '400':
          $ref: '#/components/responses/PriorityRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/IssueConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/moves:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: saveMoves
      summary: Save moves, all or none
      description: >-
        Checks a batch of moves against the board at the given revision and saves it all or not at all: each
        repository it changes gets one commit, pushed under the person's own Git login. A story moves its least
        advanced issues; a working state is entered only by work, except by an issue a person works (worker
        MANUAL), which a person moves into and through the working states by hand.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Moves'
      responses:
        '200':
          description: The moves are saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/MoveConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: createIssue
      summary: Add an idea as a new issue
      description: >-
        Writes a new issue in state Idea into the named repository of the project, saved as a move is saved: its file
        with the next free number of the repository's first issue prefix, the repository's issue index rewritten, one
        commit pushed under the person's own Git login, or nothing at all. A number an index row still holds is never
        given again. The changes stream announces the new board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIssueRequest'
      responses:
        '201':
          description: The issue is written and pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAdded'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/IssueConflict'
        '422':
          $ref: '#/components/responses/IssueRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/tasks/{task}/events:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: task
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaskLabel'
    post:
      operationId: taskEvent
      summary: Report the lifecycle of an offered task
      description: >-
        Accepts STARTED, ENDED, STOPPED or LANDED against an offer. Only ENDED carries Porelo's unmapped ended record.
        STARTED binds task and container once. LANDED reports once where a build's work landed after its ENDED,
        when that end named no landing; only then is the build's reader offered. LANDED for an unknown offer, an
        offer that did not end done, or one that already landed is refused as TaskEventConflict, so a resend
        changes nothing. Unknown, void or foreign offers and contradictory bindings are refused.
        Identical reports replay their disposition after restart, without saving or counting twice, and return only
        still-valid offers. The report is at most 131072 bytes, its answer at most 65536 UTF-8 bytes. Every save
        refusal halts the run and voids unstarted work. A late end after cancellation only clears activity.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEventRequest'
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/work/stop:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    post:
      operationId: stopStoryWork
      summary: Cancel the run
      description: >-
        Takes an empty body. Records cancellation and voids unstarted offers, retaining states, counts and findings.
        Active tasks stay at work until the window stops them and reports STOPPED or a late ENDED. Repeatable.
      tags: [work]
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues/{issue}/reading:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Issue'
    post:
      operationId: chooseReading
      summary: Choose how a stopped reading continues
      description: >-
        Checks story membership, stopped status, exact completed round and revision. The choice clears the stop
        before an offer leaves. REVIEW_ANYWAY retains findings and saves the rule's done state. ONE_MORE_ROUND
        offers a reader in the Reading rule's first mode and model, granting one more reading only at the limit;
        REWORK offers rework with the saved blocking findings and the operator's words, which it requires only
        when no saved finding blocks, in the given mode, agent and model or else the Reworking rule's first ones.
        Neither counts a reading. Stopped or halted runs refuse choices. The body is at most 65536 bytes.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingRequest'
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token the planner was started with; a missing or wrong one answers 401.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: The project's name.
      schema:
        $ref: '#/components/schemas/Name'
    Story:
      name: story
      in: path
      required: true
      description: The story's identifier.
      schema:
        $ref: '#/components/schemas/StoryId'
    Issue:
      name: issue
      in: path
      required: true
      description: The issue's identifier.
      schema:
        $ref: '#/components/schemas/IssueId'

  responses:
    RunConflict:
      description: >-
        StaleRevision(revision), WorkRunning(story,tasks[]), ReadingNotStopped(issue),
        ReadingRoundChanged(issue,rounds) or TaskEventConflict(task,event,reason). Subjects are checked before echoing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RecordUnavailable:
      description: >-
        Busy(repository) or WorkRecordUnavailable(project,reason). The record reason says why in words: fixed
        words and, where a directory or file was refused, that path named relative to the home directory (~/...)
        or to the state directory ($XDG_STATE_HOME/... or %LOCALAPPDATA%\...), never as an absolute path, and
        never the record's content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkRefused:
      description: >-
        InvalidName for an invalid path id (only a checked project may be echoed); InvalidSettings for malformed JSON,
        an oversized body, path/body disagreement or an unknown target state, with a fixed detail; WorkNotAllowed for
        a missing or unsound rule, disallowed from or mode, altered proposal facts, invalid choices or limits, or bounds;
        NoDiscussion for a discussion no sound rule offers an agent for, or whose brief is too long, with reason.
        WorkNotAllowed parameters are from, to and reason; to is always a known workflow state. A changed helper
        identity or brief has reason 'A helper identity or brief was changed.'. InvalidSettings parameters contain detail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkConflict:
      description: >-
        StaleRevision names the current revision. WorkRunning names the checked story and an array of recorded active
        task names. Revision is checked first; a story's state alone never means work is running.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The bearer token is missing or wrong; the body is empty.
      headers:
        WWW-Authenticate:
          description: Names the scheme the planner expects.
          schema:
            type: string
            const: Bearer
    InvalidLevel:
      description: The level is none of ERROR, WARN, INFO and DEBUG (InvalidLevel); the level in force stays.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:InvalidLevel
            title: InvalidLevel
            status: 400
            detail: The level is none of ERROR, WARN, INFO, DEBUG.
    InvalidName:
      description: >-
        A project name, story id or issue id was refused (InvalidName); its parameters name the project, unless the
        project's own name is the one refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:InvalidName
            title: InvalidName
            status: 400
            detail: The story id is not a valid id.
            parameters:
              project: example
    ProjectRefused:
      description: >-
        The project, its branch or its repository was refused: InvalidName for a project or branch name, NotACloneUrl
        for a repository that is not a clone URL.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            InvalidName:
              value:
                type: urn:porelo-planner:InvalidName
                title: InvalidName
                status: 400
                detail: The branch name is not a valid name.
                parameters:
                  project: example
            NotACloneUrl:
              value:
                type: urn:porelo-planner:NotACloneUrl
                title: NotACloneUrl
                status: 400
                detail: The repository is not a clone URL.
                parameters:
                  project: example
    TooManyProjects:
      description: The planner already serves as many projects as it may (TooManyProjects).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:TooManyProjects
            title: TooManyProjects
            status: 409
            detail: The planner serves at most 8 projects.
            parameters:
              project: example
    NoSuchProject:
      description: The project was never made known with a PUT (NoSuchProject).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:NoSuchProject
            title: NoSuchProject
            status: 404
            detail: The project is not known.
            parameters:
              project: example
    NoSuchStory:
      description: The project is not known (NoSuchProject) or has no such story (NoSuchStory).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchProject:
              value:
                type: urn:porelo-planner:NoSuchProject
                title: NoSuchProject
                status: 404
                detail: The project is not known.
                parameters:
                  project: example
            NoSuchStory:
              value:
                type: urn:porelo-planner:NoSuchStory
                title: NoSuchStory
                status: 404
                detail: The project has no such story.
                parameters:
                  story: ST7
    NoSuchIssue:
      description: The project is not known (NoSuchProject) or has no such issue (NoSuchIssue).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchProject:
              value:
                type: urn:porelo-planner:NoSuchProject
                title: NoSuchProject
                status: 404
                detail: The project is not known.
                parameters:
                  project: example
            NoSuchIssue:
              value:
                type: urn:porelo-planner:NoSuchIssue
                title: NoSuchIssue
                status: 404
                detail: The project has no such issue.
                parameters:
                  issue: PL4
    StoreRefused:
      description: >-
        The store could not be read: the workflow is missing (WorkflowMissing), the Git login was refused
        (CredentialRefused), or a repository could not be read (Unreadable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            WorkflowMissing:
              value:
                type: urn:porelo-planner:WorkflowMissing
                title: WorkflowMissing
                status: 502
                detail: The project's repository holds no workflow.
                parameters:
                  repository: example
            CredentialRefused:
              value:
                type: urn:porelo-planner:CredentialRefused
                title: CredentialRefused
                status: 502
                detail: The Git login was refused for the repository.
                parameters:
                  repository: example
            Unreadable:
              value:
                type: urn:porelo-planner:Unreadable
                title: Unreadable
                status: 502
                detail: The repository could not be read.
                parameters:
                  repository: example
    Unreachable:
      description: A repository could not be reached (Unreachable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:Unreachable
            title: Unreachable
            status: 504
            detail: The repository could not be reached.
            parameters:
              repository: example

    NoSuchItem:
      description: NoSuchProject(project), NoSuchStory(story), NoSuchIssue(issue), or TaskNotAnswered(task,offer) for an unknown, void or foreign offer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchStory:
              value:
                type: urn:porelo-planner:NoSuchStory
                title: NoSuchStory
                status: 404
                detail: There is no story ST9.
                parameters:
                  story: ST9
            NoSuchIssue:
              value:
                type: urn:porelo-planner:NoSuchIssue
                title: NoSuchIssue
                status: 404
                detail: There is no issue PL9.
                parameters:
                  issue: PL9
    MoveConflict:
      description: >-
        WorkRunning(story,tasks[]) when a move touches an item currently owned by active work. The board moved since
        the given revision (StaleRevision, naming the current one), or a story would stand where
        its issues do not fit and the move was not confirmed (StoryStateMismatch, naming each issue that does not fit
        with its state).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            StaleRevision:
              value:
                type: urn:porelo-planner:StaleRevision
                title: StaleRevision
                status: 409
                detail: The board moved since that revision.
                parameters:
                  revision: 9f2b6c1e0d4a8b3f7e5c2a9d1b6f4e8c3a7d0b5e9f1c2a6d8b4e7f3a0c5d9b2e
            StoryStateMismatch:
              value:
                type: urn:porelo-planner:StoryStateMismatch
                title: StoryStateMismatch
                status: 409
                detail: ST1 does not fit Rejected while its issues stand in PL2:Review.
                parameters:
                  story: ST1
                  to: Rejected
                  issues: 'PL2:Review'
    MoveRefused:
      description: >-
        A move is refused: its state is entered only by work and the item is a story or an issue an agent works
        (EnteredOnlyByWork), is no waiting or closed state
        (StateNotAllowed), or the move is not allowed (MoveNotAllowed): it names no item or one twice, closes a parent
        over an open sub-issue, the work rules have faults, the body cannot be read, or the item cannot be saved in its
        repository.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            EnteredOnlyByWork:
              value:
                type: urn:porelo-planner:EnteredOnlyByWork
                title: EnteredOnlyByWork
                status: 422
                detail: >-
                  Building is entered only by starting its work; only an issue a person works is moved there by
                  hand.
                parameters:
                  item: PL1
                  to: Building
            StateNotAllowed:
              value:
                type: urn:porelo-planner:StateNotAllowed
                title: StateNotAllowed
                status: 422
                detail: The destination must be a configured waiting or closed state.
                parameters:
                  item: PL1
                  from: Backlog
                  to: Shipped
                  reason: The destination must be a configured waiting or closed state.
            MoveNotAllowed:
              value:
                type: urn:porelo-planner:MoveNotAllowed
                title: MoveNotAllowed
                status: 422
                detail: Its sub-issue PL4.1 stands in Backlog, which is not closed.
                parameters:
                  item: PL4
                  from: Review
                  to: Finished
                  reason: Its sub-issue PL4.1 stands in Backlog, which is not closed.
    SaveRefused:
      description: >-
        The store could not save: a repository refused after others took the save (PartlySaved, naming those pushed and
        the one that failed), or the store could not be read or written (WorkflowMissing, CredentialRefused,
        Unreadable; an account whose Git has no name and email to commit with is refused as Unreadable, with words
        that say so).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            PartlySaved:
              value:
                type: urn:porelo-planner:PartlySaved
                title: PartlySaved
                status: 502
                detail: The repository refused the push.
                parameters:
                  pushed: porelo-other
                  failed: porelo-project
            CredentialRefused:
              value:
                type: urn:porelo-planner:CredentialRefused
                title: CredentialRefused
                status: 502
                detail: The Git login was refused for the repository.
                parameters:
                  repository: example
    IssueConflict:
      description: The board moved since the given revision (StaleRevision, naming the current one).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:StaleRevision
            title: StaleRevision
            status: 409
            detail: The board moved since that revision.
            parameters:
              revision: 9f2b6c1e0d4a8b3f7e5c2a9d1b6f4e8c3a7d0b5e9f1c2a6d8b4e7f3a0c5d9b2e
    IssueRefused:
      description: >-
        A new issue is refused (IssueNotAllowed): the body is no new issue or is larger than 65536 bytes (field
        empty), or a field is out of bounds (field repository, title, mustBeTrue, size, worker or revision), or the
        store cannot write it in its repository, such as a repository whose issues give no prefix (field empty). What
        was sent is never repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:IssueNotAllowed
            title: IssueNotAllowed
            status: 422
            detail: The title must have 1 to 120 characters.
            parameters:
              field: title
              reason: The title must have 1 to 120 characters.
    IdeaRefused:
      description: >-
        An idea is refused (IdeaRefused), with fixed words; what was sent is never repeated. The body is no hand-in -
        larger than 65536 bytes, not JSON, not an object, a member missing or unknown, or offer no lowercase UUID -
        with one fault; or the idea breaks the idea format, at most 100 faults, each starting with the field it names
        (story, story.title, issues, issues[0].repository, counted from 0); or the store cannot write it, its words
        as the one fault; or the offer's save is still pending or was only partly pushed, with pushed naming the
        repositories already pushed (comma-joined, empty when none).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Malformed:
              value:
                type: urn:porelo-planner:IdeaRefused
                title: IdeaRefused
                status: 422
                detail: The idea does not follow the idea format.
                parameters:
                  faults:
                    - 'story.title: The title must be one line of 1 to 120 characters.'
                    - 'issues[1].worker: The worker must be Agent or Manual.'
            PartlySaved:
              value:
                type: urn:porelo-planner:IdeaRefused
                title: IdeaRefused
                status: 422
                detail: The idea of this offer was saved only in part and is not saved again.
                parameters:
                  pushed: porelo-other
                  faults:
                    - 'offer: The idea of this offer was saved only in part and is not saved again.'
    PriorityRefused:
      description: >-
        A project name or story id was refused (InvalidName), or the body is no priority change (PriorityNotAllowed,
        naming the story): not one JSON object of at most 65536 bytes with exactly a revision and one of the five
        priorities. What was sent is never repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            InvalidName:
              value:
                type: urn:porelo-planner:InvalidName
                title: InvalidName
                status: 400
                detail: The story id is not a valid id.
                parameters:
                  project: example
            PriorityNotAllowed:
              value:
                type: urn:porelo-planner:PriorityNotAllowed
                title: PriorityNotAllowed
                status: 400
                detail: The priority must be Highest, High, Medium, Low or Lowest.
                parameters:
                  story: ST7
    NotOffered:
      description: >-
        This planner's store saves no moves, adds no issues, saves no workers, saves no priorities or adds no ideas;
        the mock mode saves moves and workers and adds ideas into its in-memory board, but adds no issues and saves no
        priorities (NotOffered).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:NotOffered
            title: NotOffered
            status: 501
            detail: This planner does not save moves.
            parameters:
              project: example
    Busy:
      description: Another save or a fetch held the project longer than the planner waits (Busy).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:Busy
            title: Busy
            status: 503
            detail: The project is busy with another save; try again.
            parameters:
              repository: porelo-project

  schemas:
    Name:
      description: The name of a project or a repository.
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,99}$'
    StoryId:
      description: A story's identifier.
      type: string
      pattern: '^ST[0-9]{1,5}$'
    IssueId:
      description: An issue's identifier, a prefix and a number, with a sub-issue's number after a dot.
      type: string
      pattern: '^[A-Z]{1,4}[0-9]{1,5}(\.[0-9]{1,3})?$'
    Revision:
      description: >-
        The store's revision the answer was read at; opaque to the window, which compares it only for equality. At
        most 200 printable characters without spaces, however many repositories the project has, since the window
        sends it back as the `Last-Event-ID` header; the Git store gives a SHA-256 as 64 lower-case hexadecimal
        characters.
      type: string
      pattern: '^[!-~]{1,200}$'

    Level:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [ERROR, WARN, INFO, DEBUG]
          description: How much the planner's log holds, the least first; INFO when none was set.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP

    ProjectSource:
      description: Where a project's planning is kept.
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          description: >-
            The project's own repository's clone URL, as https://host/path, ssh://[user@]host/path or user@host:path.
        branch:
          type: string
          description: The branch to read and write; the repository's default branch when absent.

    Workflow:
      description: A project's workflow.
      type: object
      required: [revision, states, phases, work, faults]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        states:
          type: array
          description: The states in workflow order.
          items:
            $ref: '#/components/schemas/State'
        phases:
          type: array
          description: The board's columns in order.
          items:
            $ref: '#/components/schemas/Phase'
        work:
          type: array
          description: The sound work rules.
          items:
            $ref: '#/components/schemas/WorkRule'
        faults:
          type: array
          description: >-
            What was found wrong reading the workflow, and each story, issue or reference left out because it could
            not be read, in the planner's words. The rest of the board is answered.
          items:
            type: string
    State:
      description: One state of the workflow.
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: >-
            CLOSED when the workflow closes the state, WORKING when a sound work rule exists for it, else WAITING.
          enum: [WAITING, WORKING, CLOSED]
    Phase:
      description: One column of the board and its states.
      type: object
      required: [name, states]
      properties:
        name:
          type: string
        states:
          type: array
          description: The names of the column's states, in order.
          items:
            type: string
    WorkRule:
      description: How work is done in a working state.
      type: object
      required: [state, from, done, then, blocked, per, modes, order, models]
      properties:
        state:
          type: string
          description: The working state.
        from:
          type: array
          description: The states work may start from.
          items:
            type: string
        done:
          type: string
          description: The state a story or issue reaches when the work is done.
        then:
          type: [string, 'null']
          description: The state that follows the done state, or null when none does.
        blocked:
          type: [string, 'null']
          description: The state a blocked work goes to, or null when none is named.
        per:
          type: string
          description: Whether one task works the whole story or one each repository.
          enum: [story, repository]
        modes:
          type: array
          description: The ways the work may run, such as SHELL, AGENT or UNATTENDED.
          items:
            type: string
        order:
          type: string
          description: The work order given to the task.
        models:
          type: object
          description: The model for each agent, in order of preference.
          additionalProperties:
            type: string

    Board:
      description: >-
        The whole board at one revision, as an event of the stream carries it - the workflow, the project's
        repositories and the stories.
      type: object
      required: [revision, states, phases, work, faults, repositories, stories]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        repositories:
          type: array
          description: >-
            The project's repositories, its own first, the others in the order project.yml names them; a new issue
            may be added in each of them, whether or not a story names an issue of it.
          items:
            $ref: '#/components/schemas/Name'
        states:
          type: array
          description: The states in workflow order.
          items:
            $ref: '#/components/schemas/State'
        phases:
          type: array
          description: The board's columns in order.
          items:
            $ref: '#/components/schemas/Phase'
        work:
          type: array
          description: The sound work rules.
          items:
            $ref: '#/components/schemas/WorkRule'
        faults:
          type: array
          description: >-
            What was found wrong reading the workflow, and each story, issue or reference left out because it could
            not be read, in the planner's words. The rest of the board is answered.
          items:
            type: string
        stories:
          type: array
          description: Every story, without its description.
          items:
            $ref: '#/components/schemas/Story'

    Moves:
      description: A batch of moves against the board at a revision.
      type: object
      required: [revision, moves]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        moves:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Move'
        confirm:
          type: boolean
          default: false
          description: Whether a story may stand where its issues do not fit.
    Move:
      description: One move, naming exactly one story or one issue.
      type: object
      required: [to]
      properties:
        story:
          $ref: '#/components/schemas/StoryId'
        issue:
          $ref: '#/components/schemas/IssueId'
        to:
          type: string
          description: The state it moves to.
    Moved:
      description: The board's revision after the save, and every issue the batch moved, each once.
      type: object
      required: [revision, moved]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        moved:
          type: array
          items:
            $ref: '#/components/schemas/IssueId'

    Worker:
      description: Who works an issue, an agent through the tasks the planner starts or a person by hand.
      type: string
      enum: [AGENT, MANUAL]
    WorkerRequest:
      description: An issue's new worker, against the board at a revision; no other member is taken.
      type: object
      additionalProperties: false
      required: [worker, revision]
      properties:
        worker:
          $ref: '#/components/schemas/Worker'
        revision:
          $ref: '#/components/schemas/Revision'
    WorkerSaved:
      description: The board's revision after the save.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    Priority:
      description: A story's priority, the highest first.
      type: string
      enum: [Highest, High, Medium, Low, Lowest]
    PriorityRequest:
      description: A story's new priority, against the board at a revision; no other member is taken.
      type: object
      additionalProperties: false
      required: [priority, revision]
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        revision:
          $ref: '#/components/schemas/Revision'
    PrioritySaved:
      description: The board's revision after the save.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    NewIssueRequest:
      description: An idea a person wrote, against the board at a revision; no other member is taken.
      type: object
      additionalProperties: false
      required: [repository, title, mustBeTrue, revision]
      properties:
        repository:
          $ref: '#/components/schemas/Name'
        title:
          type: string
          description: >-
            One line without control characters; the spaces around it are dropped. At most 120 characters, as an
            issue's head holds its title.
          minLength: 1
          maxLength: 120
        mustBeTrue:
          type: string
          description: The paragraph the issue's file opens with.
          minLength: 1
          maxLength: 4000
        size:
          type: string
          enum: [XS, S, M, L, XL]
        worker:
          description: Who works the new issue; AGENT when it is left out.
          allOf:
            - $ref: '#/components/schemas/Worker'
        revision:
          $ref: '#/components/schemas/Revision'
    IssueAdded:
      description: The new issue's id and the board's revision after the save.
      type: object
      required: [id, revision]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        revision:
          $ref: '#/components/schemas/Revision'
    IdeaRequest:
      description: The idea a discussion's task wrote and the discussion's offer; no other member is taken.
      type: object
      additionalProperties: false
      required: [offer, idea]
      properties:
        offer:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The offer of the discussion's task, as the discussion answered it.
        idea:
          $ref: '#/components/schemas/Idea'
    Idea:
      description: >-
        The idea format, as the task's result file holds it and the window hands it on unchanged: one story and an
        issue in each repository it concerns, each repository named once. One line means no control character or
        line break (U+0000 to U+001F, U+007F to U+009F, U+2028, U+2029); the spaces around a title, gain or test are
        dropped, and lengths count code points.
      type: object
      additionalProperties: false
      required: [story, issues]
      properties:
        story:
          $ref: '#/components/schemas/IdeaStory'
        issues:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdeaIssue'
    IdeaStory:
      description: The idea's story, saved in state Idea in the project's own repository.
      type: object
      additionalProperties: false
      required: [title, gain, test, priority]
      properties:
        title:
          type: string
          description: One line.
          minLength: 1
          maxLength: 120
        gain:
          type: string
          description: What a user gains, one line.
          minLength: 1
          maxLength: 400
        test:
          type: string
          description: How a person sees it work, one line.
          minLength: 1
          maxLength: 400
        priority:
          $ref: '#/components/schemas/Priority'
    IdeaIssue:
      description: One issue of the idea, saved in state Idea in its repository.
      type: object
      additionalProperties: false
      required: [repository, title, mustBeTrue, worker]
      properties:
        repository:
          description: One of the project's repositories, named by no other issue of the idea.
          allOf:
            - $ref: '#/components/schemas/Name'
        title:
          type: string
          description: One line.
          minLength: 1
          maxLength: 120
        mustBeTrue:
          type: string
          description: The paragraph the issue's file opens with; not blank.
          minLength: 1
          maxLength: 4000
        size:
          type: string
          enum: [XS, S, M, L, XL]
        worker:
          type: string
          description: Who works the issue, as the person chose it.
          enum: [Agent, Manual]
    IdeaAdded:
      description: The id of the story the offer's idea was saved as.
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/StoryId'

    Refreshed:
      description: The revision after a fetch.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'

    StoryList:
      description: Stories at one revision.
      type: object
      required: [revision, stories]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/Story'
    StoryReply:
      description: One story at one revision.
      type: object
      required: [revision, story]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        story:
          $ref: '#/components/schemas/StoryDetail'
    Story:
      description: One story as the board shows it.
      type: object
      required: [id, title, state, stateGiven, priority, link, issues, work]
      properties:
        id:
          $ref: '#/components/schemas/StoryId'
        title:
          type: string
        state:
          type: string
        stateGiven:
          type: boolean
          description: True when the story's head states its state, false when its issues give it.
        priority:
          type: string
        link:
          type: [string, 'null']
          format: uri
          description: The story's web page, or null when it has none.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        work:
          oneOf:
            - $ref: '#/components/schemas/PlanWork'
            - type: 'null'
          description: The current recorded run, null without a record.
    StoryDetail:
      description: One story with its description.
      allOf:
        - $ref: '#/components/schemas/Story'
        - type: object
          required: [description]
          properties:
            description:
              type: string
              description: The story's text.

    IssueList:
      description: A story's issues at one revision.
      type: object
      required: [revision, issues]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    IssueReply:
      description: One issue at one revision.
      type: object
      required: [revision, issue]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        issue:
          $ref: '#/components/schemas/IssueDetail'
    Issue:
      description: One issue of a story.
      type: object
      required: [id, repository, title, state, size, blockedBy, parent, link, worker, atWork, needsYou, readingStopped, noRunHere, attention]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        title:
          type: string
        state:
          type: string
        size:
          type: [string, 'null']
          description: The issue's size, or null when it has none.
        blockedBy:
          type: array
          description: The issues blocking it.
          items:
            $ref: '#/components/schemas/IssueId'
        parent:
          description: The issue this one is a sub-issue of, or null.
          oneOf:
            - $ref: '#/components/schemas/IssueId'
            - type: 'null'
        link:
          type: [string, 'null']
          format: uri
          description: The issue's web page, or null when it has none.
        worker:
          description: Who works it. A head that names none is worked by an agent; a sub-issue is worked as its parent is.
          allOf:
            - $ref: '#/components/schemas/Worker'
        rounds:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Absent when no reading record is known.
        roundsMost:
          type: integer
          minimum: 1
          maximum: 2147483647
        atWork:
          type: boolean
        needsYou:
          type: boolean
          description: >-
            Whether the person must act on it: a run of this planner raised it, with the reason in attention. An issue
            a person works, or one with no run here, is never raised.
        readingStopped:
          type: boolean
        noRunHere:
          type: boolean
          description: >-
            Whether an issue an agent works stands in a working state with no run in this planner's record, such as
            work started elsewhere or set by a commit; it is shown, not raised.
        attention:
          type: string
          enum: [NONE, BLOCKING_FINDINGS, ROUND_LIMIT, UNPUSHED, FAILED, BLOCKED, STOPPED, INVALID_FINDINGS, SAVE_REFUSED, NEXT_STEP_UNAVAILABLE]
          description: Why the person must act, the reason the run reported; NONE when needsYou is false.
        findings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Finding'
    IssueDetail:
      description: One issue with its text and sub-issues.
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [text, subIssues]
          properties:
            text:
              type: string
              description: The issue's text.
            subIssues:
              type: array
              items:
                $ref: '#/components/schemas/IssueId'
            whatMustBeTrue:
              type: string
              description: The issue's What must be true paragraph; absent when the text has none.

    StoryWorkProposalRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          description: A state named by the workflow.
    StoryWorkProposal:
      type: object
      required: [modes, repositories, coordinator, comment, readingRounds, issueReadingRounds, revision, manual]
      properties:
        modes:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/PlanRepositoryWork'
        coordinator:
          type: string
          enum: [START, TELL]
          description: START until the run supplies an active coordinator record; otherwise TELL.
        comment:
          type: string
          default: ''
          maxLength: 4000
        readingRounds:
          $ref: '#/components/schemas/ReadingRounds'
        issueReadingRounds:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/IssueReadingRounds'
        revision:
          $ref: '#/components/schemas/Revision'
        manual:
          type: array
          description: >-
            The story's open issues a person works (worker MANUAL), in story order: no task of this proposal
            names them, and a person moves them through the work by hand.
          items:
            $ref: '#/components/schemas/IssueId'
    PlanRepositoryWork:
      type: object
      additionalProperties: false
      required: [repository, issues, main, subAgents]
      properties:
        repository:
          $ref: '#/components/schemas/Name'
        issues:
          type: array
          description: The proposal's issue identities in order; immutable at acceptance.
          items:
            $ref: '#/components/schemas/IssueId'
        main:
          $ref: '#/components/schemas/PlanWorker'
        subAgents:
          type: array
          items:
            $ref: '#/components/schemas/PlanAssignment'
    PlanWorker:
      type: object
      additionalProperties: false
      required: [name, role, agent, model, brief]
      properties:
        name:
          type: string
        role:
          type: string
          const: MAIN
        agent:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        brief:
          type: string
          maxLength: 4000
          description: The rule's order, expanded after the operator's final choices.
    PlanAssignment:
      type: object
      additionalProperties: false
      required: [id, issue, name, kind, agent, model, workingState, brief, choice]
      properties:
        id:
          type: string
          description: Stable within this repository.
        issue:
          $ref: '#/components/schemas/IssueId'
        name:
          type: string
        kind:
          type: string
          description: The participant's role; only BUILDER is proposed at start.
        agent:
          type: string
        model:
          type: string
        workingState:
          type: string
        brief:
          type: string
          maxLength: 4000
        choice:
          type: string
          enum: [KEEP, CHANGE, DROP]
          default: KEEP
    ReadingRounds:
      type: integer
      minimum: 1
      maximum: 10
      default: 2
    IssueReadingRounds:
      type: object
      additionalProperties: false
      required: [issue, rounds]
      properties:
        issue:
          $ref: '#/components/schemas/IssueId'
        rounds:
          $ref: '#/components/schemas/ReadingRounds'
    StoryWorkRequest:
      type: object
      additionalProperties: false
      required: [project, story, to, mode, revision]
      properties:
        project:
          $ref: '#/components/schemas/Name'
        story:
          $ref: '#/components/schemas/StoryId'
        to:
          type: string
        mode:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/PlanRepositoryWork'
        comment:
          type: string
          maxLength: 4000
        readingRounds:
          $ref: '#/components/schemas/ReadingRounds'
        issueReadingRounds:
          type: array
          description: Only proposal issues, each at most once.
          items:
            $ref: '#/components/schemas/IssueReadingRounds'
    StoryWorkOrder:
      type: object
      required: [revision, tasks]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanningStartTask'
    IdeaDiscussionRequest:
      type: object
      additionalProperties: false
      required: [idea]
      properties:
        idea:
          type: string
          minLength: 1
          maxLength: 4000
          description: The person's first words of the idea, not blank, counted in Unicode code points.
    PlanningStartTask:
      type: object
      required: [offer, issues, role, agent, model, mode, prompt, reads]
      description: >-
        repository is present for MAIN, BUILDER and READER and absent for DISCUSSION; result is present for
        DISCUSSION alone.
      properties:
        offer:
          type: string
          format: uuid
        repository:
          $ref: '#/components/schemas/Name'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueId'
        role:
          type: string
          enum: [MAIN, BUILDER, READER, DISCUSSION]
        agent:
          type: string
        model:
          type: string
        mode:
          type: string
        prompt:
          type: string
          description: The complete starting prompt, at most 65536 UTF-8 bytes.
        result:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: The plain name of the file the task hands back, without a directory.
        reads:
          type: array
          description: >-
            The Porelo task names whose work a READER reads, so Porelo's gate gives it their branches read only;
            empty for every other role.
          items:
            $ref: '#/components/schemas/TaskLabel'

    TaskLabel:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
    RefName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^(?![-/])(?![\s\S]*\.\.)(?![\s\S]*/$)(?![\s\S]*\.lock$)[^\u0000-\u0020\u007F-\u009F\u2028\u2029~^:?*\[\\]+$'
      description: >-
        A Git ref name of 1 to 255 characters (Unicode code points), letters beyond ASCII included, without "..",
        control characters, spaces, line or paragraph separators or any of ~^:?*[\, not starting with - or /, not
        ending with / or .lock.
    Landing:
      type: object
      additionalProperties: false
      required: [branch, ref, remote, commit]
      description: >-
        Where a task's work landed, copied unchanged from Porelo's task row; the planner never derives one of
        these names. A reader's order names the commit and the remote-tracking name, read after
        `git fetch origin`.
      properties:
        branch:
          $ref: '#/components/schemas/RefName'
        ref:
          type: string
          minLength: 6
          maxLength: 255
          pattern: '^refs/(?![\s\S]*\.\.)(?![\s\S]*/$)(?![\s\S]*\.lock$)[^\u0000-\u0020\u007F-\u009F\u2028\u2029~^:?*\[\\]+$'
          description: The ref Porelo serves the work under, a RefName starting with refs/.
        remote:
          $ref: '#/components/schemas/RefName'
          description: The remote-tracking name a reader sees after a plain git fetch, such as origin/landed/t/b.
        commit:
          type: string
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
          description: The landed commit, 40 or 64 lowercase hex digits.
    TaskEventRequest:
      type: object
      additionalProperties: false
      required: [offer, event, container, machine]
      properties:
        offer:
          type: string
          format: uuid
        event:
          type: string
          enum: [STARTED, ENDED, STOPPED, LANDED]
        container:
          $ref: '#/components/schemas/TaskLabel'
        machine:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?![\s\S])'
          description: >-
            The machine's name as the person sees it, 1 to 128 Unicode code points
            (not UTF-16 code units), without control characters or line breaks.
            Kept and answered back verbatim, never used as a path, a file name or a URL.
        ended:
          $ref: '#/components/schemas/TaskEnded'
        landed:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Landing'
      description: >-
        ended is required only for ENDED and forbidden for STARTED, STOPPED and LANDED; landed, with at least one
        entry, is required only for LANDED and forbidden for the others, whose end carries its own.
    TaskEnded:
      type: object
      additionalProperties: false
      required: [at, finished, why, answer, unpushed]
      properties:
        at:
          type: string
          format: date-time
          maxLength: 128
        finished:
          type: boolean
        why:
          type: string
          maxLength: 4000
        answer:
          type: string
          description: The agent's unmapped answer, at most 65536 UTF-8 bytes.
        unpushed:
          type: integer
          minimum: 0
          maximum: 2147483647
        landed:
          type: array
          description: >-
            Where the task's work landed, copied unchanged from Porelo's task row; absent or empty while the
            work still waits at the gate.
          items:
            $ref: '#/components/schemas/Landing'
        outcome:
          type: string
          enum: [DONE, BLOCKED, FAILED]
          description: >-
            The outcome the task declared, copied unchanged from Porelo's end record; absent when it declared none.
            BLOCKED and FAILED leave the task's issues in their state under Needs you, whatever finished says, and why
            carries the task's reason; DONE and an absent outcome are judged by finished and unpushed.
    ReadingRequest:
      type: object
      additionalProperties: false
      required: [story, round, choice, comment, revision]
      properties:
        story:
          $ref: '#/components/schemas/StoryId'
        round:
          type: integer
          minimum: 0
          maximum: 2147483647
        choice:
          type: string
          enum: [REVIEW_ANYWAY, ONE_MORE_ROUND, REWORK]
        comment:
          type: string
          maxLength: 4000
        revision:
          $ref: '#/components/schemas/Revision'
        mode:
          type: string
          maxLength: 128
          description: >-
            The rework's mode, one of the Reworking rule's modes. mode, agent and model come together or not at
            all; without them a rework takes the rule's first mode and first model, and another choice refuses
            them as InvalidSettings.
        agent:
          type: string
          maxLength: 128
          description: The rework's agent, one of the Reworking rule's agents.
        model:
          type: string
          maxLength: 128
          description: The rework's model, the Reworking rule's model for that agent.
      dependentRequired:
        mode: [agent, model]
        agent: [mode, model]
        model: [mode, agent]
    StoryWorkReply:
      type: object
      required: [work]
      properties:
        work:
          oneOf:
            - $ref: '#/components/schemas/PlanWork'
            - type: 'null'
    TaskEventReply:
      type: object
      required: [revision, work, tasks]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        work:
          $ref: '#/components/schemas/PlanWork'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanningStartTask'
    ReadingReply:
      type: object
      required: [issue, work, revision, tasks]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
        work:
          $ref: '#/components/schemas/PlanWork'
        revision:
          $ref: '#/components/schemas/Revision'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanningStartTask'
    PlanWork:
      type: object
      required: [tasks, coordinator, since, atWork, repositories, comment, readingRounds, issueReadingRounds, issues]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanWorkTask'
        coordinator:
          type: [string, 'null']
        since:
          type: string
        atWork:
          type: boolean
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/PlanRepositoryWork'
        comment:
          type: string
        readingRounds:
          type: integer
        issueReadingRounds:
          type: array
          items:
            $ref: '#/components/schemas/IssueReadingRounds'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PlanWorkIssue'
    PlanWorkTask:
      type: object
      required: [task, containerId, machine, repository, issues, state, done, mode, agent, model, role, since, atWork, ended]
      properties:
        task:
          type: string
        containerId:
          type: string
        machine:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?![\s\S])'
          description: >-
            The machine's name as the person sees it, kept and answered back verbatim,
            never used as a path, a file name or a URL. Null until a report names it.
            Length is measured in Unicode code points, not UTF-16 code units.
        repository:
          $ref: '#/components/schemas/Name'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueId'
        state:
          type: string
        done:
          type: string
        mode:
          type: string
        agent:
          type: string
        model:
          type: string
        role:
          type: string
          enum: [MAIN, BUILDER, READER]
        since:
          type: string
        atWork:
          type: boolean
        ended:
          oneOf:
            - $ref: '#/components/schemas/TaskEnded'
            - type: 'null'
    PlanWorkIssue:
      type: object
      required: [issue, reason, rounds, roundsMost, atWork, needsYou, readingStopped, findings]
      properties:
        issue:
          $ref: '#/components/schemas/IssueId'
        reason:
          type: string
          enum: [NONE, BLOCKING_FINDINGS, ROUND_LIMIT, UNPUSHED, FAILED, BLOCKED, STOPPED, INVALID_FINDINGS, SAVE_REFUSED, NEXT_STEP_UNAVAILABLE, MANUAL]
          description: >-
            Why the issue needs attention, NONE if it does not; MANUAL says a person now works it, so no further task
            of the run takes it and it needs nobody's attention. BLOCKING_FINDINGS and ROUND_LIMIT both stop a
            reading with blocking findings, readingStopped true: below the readings granted and at them. BLOCKED says
            the task declared its work blocked; the issue stays in its state and the task's why says what blocks it.
            A move of the issue by hand clears its reason and its stop.
        rounds:
          type: integer
          minimum: 0
          maximum: 2147483647
        roundsMost:
          type: integer
          minimum: 1
          maximum: 2147483647
        atWork:
          type: boolean
        needsYou:
          type: boolean
        readingStopped:
          type: boolean
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
    Finding:
      type: object
      required: [number, severity, text]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 100
        severity:
          type: string
          enum: [BLOCKING, NOTE]
        file:
          type: string
          maxLength: 512
          description: A display-only relative label, without a leading slash or backslash or any parent segment.
        line:
          type: integer
          minimum: 1
          maximum: 2147483647
        text:
          type: string
          maxLength: 4000

    Problem:
      description: A refusal; the last part of its type is the refusal's name.
      type: object
      required: [type, title, status, detail, parameters]
      properties:
        type:
          type: string
          pattern: '^urn:porelo-planner:[A-Z][A-Za-z]+$'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: The planner's words for the refusal, never a credential or a local path.
        parameters:
          type: object
          description: Typed subjects and checked words describing the refusal.
          properties:
            project:
              type: string
            story:
              type: string
            issue:
              type: string
            repository:
              type: string
            revision:
              type: string
            item:
              type: string
            field:
              type: string
              description: The member of a new issue's body a refusal is about, or empty.
            from:
              type: string
            to:
              type: string
            reason:
              type: string
            issues:
              type: string
              description: Comma-joined, each issue with its state.
            pushed:
              type: string
              description: Comma-joined repositories.
            failed:
              type: string
            detail:
              type: string
            task:
              type: string
            offer:
              type: string
              format: uuid
            event:
              type: string
              enum: [STARTED, ENDED, STOPPED, LANDED]
            rounds:
              type: integer
            tasks:
              type: array
              items:
                type: string
            faults:
              type: array
              description: An idea's faults, each starting with the field it names, in fixed words.
              maxItems: 100
              items:
                type: string
                maxLength: 1000
