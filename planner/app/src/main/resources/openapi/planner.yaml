        or pushed. The request carries no revision and no versions. The digest answered covers the project's
        repository and branch, the batch, every target with its version, each from and to state, the warnings and the
        runs and offers they name, never the board's revision; the save sends it back, and the targets in its `seen`.
        A refusal the save would answer for the batch itself, such as a working state, an unknown item or an open
        story moved to another open state, is answered here too. A planner that does not know this operation answers
        404, and the window then moves nothing.
