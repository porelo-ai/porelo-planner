        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/MoveConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/corrections/preview:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: previewCorrection
      summary: Answer what the correction of one warning would write, writing nothing
      description: >-
        Checks the correction a warning's `correction` offers, other than a Move, against the board as the planner
        reads it, with what the person picked among its `choices`, and answers what it would write, its targets with
        their versions and the digest the save sends back; the request carries no revision and no versions. A
        Priority of a story and the Labels of a repository are the kinds carried out here; any other is answered
        NotOffered, and so is a Labels by a store that holds no repository's labels. Nothing is written or pushed.
        The digest covers the project's repository and branch, the item or the repository corrected, every target
        with its version, the warning's kind, what the item holds now (`from`), the choice and every call, never the
        board's revision. While the work rules have faults no correction of an item is offered and one asked for is
        refused (CorrectionRefused); a repository's correction touches no item and is judged without them. A
        repository's labels are read anew from its forge, to their last page as every read of them, before its
        calls are computed, so no call names a label someone deleted or created since they were last read; a read
        the forge refuses, or of more labels than the planner reads, is refused as a call that cannot be saved
        (MoveNotAllowed), named by the forge's status alone, and a read the forge does not answer, or refuses for the
        login, as the store's refusals answer it. A Move is previewed and saved through
        /moves/preview and /moves, as any move of the issue.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '200':
          description: What the correction would write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionPreview'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/CorrectionConflict'
        '422':
          $ref: '#/components/responses/CorrectionRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/corrections:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: saveCorrection
      summary: Save the correction of one warning whose preview the person confirmed
      description: >-
        Saves the correction its preview showed, as a move is saved: one commit in the planner's own clone, pushed
        after the answer under the person's own Git login, or nothing at all. Under the writer lock, before anything
        is written, the correction is checked again on the board as it stands: each of the preview's targets must
        stand at the version `seen` holds for it (ItemChanged; BasisIncomplete for one `seen` lacks), the warning must
        still stand on the item, no other warning may hold the item
        back and the work rules may have no faults (CorrectionRefused), and the preview, computed again, must answer
        the digest sent (PreviewChanged). A stale, changed or repeated confirm so writes nothing. Only the warning
        corrected is lifted, only for this write; any other warning holds the item as before. A correction never
        writes a state: a Priority writes the story's priority alone, touches no issue and so neither waits on nor
        stops a run. A Labels makes exactly the calls its preview listed on the repository's forge, with the
        person's own login there and in the preview's order, and no commit; it has no targets, so `seen` is exactly
        `{}`, since a repository has no item version, and any other is refused (MoveNotAllowed, "A repository's
        correction sends its versions seen as {}."). The repository's labels are read anew from its forge, as for
        the preview; its warning must still stand, so a second run, once the warning is gone, writes nothing
        (CorrectionRefused), and the calls computed again from them must answer the digest sent, so labels changed
        since the preview write nothing (PreviewChanged). A call the forge refuses stops the calls after it and is refused as
        a call that cannot be saved (MoveNotAllowed), named by the forge's status alone, never its words; the calls
        made before it stay made, and the repository's labels are read again at the next Refresh.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionConfirm'
      responses:
        '200':
          description: The correction is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionSaved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/CorrectionConflict'
        '422':
          $ref: '#/components/responses/CorrectionRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listIssues
      summary: List the issues in no story
      description: >-
        Answers the board's issues that no story names and that are not sub-issues, at any depth, of an issue a
        story names. An issue in a state the workflow does not have is listed too, with its warning, after those in
        the workflow's states. Issues follow the board's order of states, then the order in which the store
        supplies the board's issues. The story query parameter is required and accepts only none; a missing or other value is refused
        before any board or work record is read (InvalidName).
      tags: [board]
      parameters:
        - name: story
          in: query
          required: true
          description: Selects only issues in no story.
          schema:
            type: string
            enum: [none]
      responses:
        '200':
          description: The issues in no story at the board's revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'
    post:
      operationId: createIssue
      summary: Add an idea as a new issue
      description: >-
        Writes a new issue into the named repository of the project, saved as a move is saved; the story it is hung
        into, when one is named, is its one target, checked against the version `seen` holds for it, and `seen` is
        otherwise not checked. The Git store writes
        its file in the first state with the next free number of the repository's first issue prefix, rewrites the
        repository's issue index and commits in the planner's own clone, pushed after the answer under the person's
        own Git login. A number an index row still holds is never given again. On every store, a state the workflow
        lacks is refused with StateNotAllowed (422) before anything is created, and is never repeated. For a GitHub
        store, the requested state and fields are written in the create's single save, with one revision, and the
        state is checked as a move is before anything is created: a closed state is refused with StateNotAllowed
        (422), a working state while a run in this planner's record works the issue's story with EnteredOnlyByWork
        (422), and other move checks answer 422 with the
        move's refusal, never PartlySaved; the item parameter is empty because no issue exists yet. A store without
        creation in a state keeps the create followed by a move, whose failure is PartlySaved. The JSON body is at
        most 1048576 bytes. A composed GitHub issue body over 65536 characters is refused by the store, never cut.
        The new issue's topic labels, when named, are set as an edit sets them: the Git store sets none (NotOffered,
        before anything is created), and on GitHub a label the issue read back does not carry is refused
        (LabelsNotKept, naming the repository and the new issue, which stands without it). The changes stream
        announces the new board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIssueRequest'
      responses:
        '201':
          description: The issue and its placement are saved; the answer names the resulting board revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAdded'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/IssueConflict'
        '422':
          $ref: '#/components/responses/IssueRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/items:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: addUnlistedIssue
      summary: Add an issue made outside the project
      description: >-
        Adds one open issue the board offers among its unlisted issues to the project, checked against the unlisted
        issue's own version `seen` holds for it, in one save: an issue enters the workflow's first state with Worker Manual, Priority Medium and the
        rank after the last issue of that priority; a story, an issue of the tracker's issue type Story in the project's
        own repository, gets Priority Medium and its rank and no state, so its state follows its issues. A store that
        adds no issue made outside the project answers NotOffered for any issue, before the issue is looked for; the Git
        store and the mock mode answer so. An issue the board does not offer, one on the board or outside its workflow
        among them, or one the tracker no longer holds, answers NotUnlisted, and the window reads the board again. On
        GitHub the issue is read again right before the write: one a person added to the project, closed or moved since
        the board was read is refused (ItemChanged, naming the issue), and one the board would show only as a warned
        issue no work starts on once added - a story outside the project's own repository, an issue under an issue that
        is no item of the project, that the board does not place, that is a sub-issue itself or that is of another
        repository, an issue blocked by a story or by an item the board does not place, a story that blocks an item of
        the project - is refused (EditNotAllowed, field issue, naming the warning and what to repair), each before
        anything is written. A refusal never repeats the tracker's title or text. A failure after GitHub added the issue
        is PartlySaved, and the issue then stands outside the workflow until its state is moved. The JSON body is at
        most 65536 bytes. The changes stream announces the new board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListIssueRequest'
      responses:
        '200':
          description: The issue is saved on the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSaved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotUnlisted'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/EditRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/tracker/items:
    parameters:
      - $ref: '#/components/parameters/Project'
    put:
      operationId: setItemsDirectory
      summary: Choose where a local project's stories and issues are kept
      description: >-
        Keeps the directory the planner reads and writes a local project's stories and issues in, for this project, in
        the planner's own state on this computer and never in the project's files, and reopens the project's store on
        it; `null` goes back to the default directory. The call is checked in this order: the project's name
        (InvalidName), the project is known (NoSuchProject), its tracker is `local` (else NotOffered), then the body
        and the directory (ItemsDirectoryRefused, 400). The body is one JSON object of at most 8192 bytes with exactly
        the members `directory`, a string or an explicit `null`, and `seen`, an object, and no member twice; it has no
        target, so its `seen` is not checked against any version. The directory must be an ItemsDirectory that
        exists, is a directory, is reached through no symbolic link, neither itself nor any directory above it, and
        is the account's alone, and it is checked again at every read and write; it is never made. A directory
        refused is answered naming it when it is an ItemsDirectory, and nothing is kept. Choosing the directory in use
        again keeps nothing anew, reopens nothing and answers the tracker as it stands. Otherwise the project's store
        is opened anew on the directory, which ends the project's changes streams; a window opens its stream again
        and is answered the board read from the directory now kept. A write the old store took before the swap ends
        first; one based on the old store's board that reaches the store after it is refused as Busy, as a save
        that lost to another, and the window reads the board again. A choice that cannot be written to the
        planner's state directory is refused as WorkRecordUnavailable, and the project stays as it was. When the
        directory kept is taken but the project's reads stay refused, as for a default directory outside the rule
        an ItemsDirectory follows, the choice is kept and the call answers ItemsDirectoryRefused with 409.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemsDirectoryRequest'
      responses:
        '200':
          description: The directory is kept, and the project's tracker as it stands now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracker'
        '400':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '503':
          $ref: '#/components/responses/RecordUnavailable'

  /projects/{project}/tasks/{task}/events:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: task
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaskLabel'
    post:
      operationId: taskEvent
      summary: Report the lifecycle of an offered task
      description: >-
        Accepts STARTED, ENDED, STOPPED or LANDED against an offer. Only ENDED carries Porelo's unmapped ended record.
        STARTED binds task and container once. LANDED reports once where a build's work landed after its ENDED,
        when that end named no landing; only then is the build's reader offered. LANDED for an unknown offer, an
        offer that did not end done, or one that already landed is refused as TaskEventConflict, so a resend
        changes nothing. Unknown, void or foreign offers and contradictory bindings are refused.
        Identical reports replay their disposition after restart, without saving or counting twice, and return only
        still-valid offers. The report is at most 131072 bytes, its answer at most 65536 UTF-8 bytes. Every save
        refusal halts the run and voids unstarted work. A late end after cancellation only clears activity. An ENDED
        of a task whose rule hands back a result moves none of its issues, whatever its outcome: a saved result
        moved them already, and without one they stay with NEXT_STEP_UNAVAILABLE and one line why.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEventRequest'
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/tasks/{task}/result:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: task
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaskLabel'
    post:
      operationId: handStageResult
      summary: Hand in the result a stage's task wrote
      description: >-
        Takes the result file an analysis or estimation task wrote, which the window hands in unchanged with the
        task's offer while the task is at work, before its ENDED; or, when the task left no readable file, one line
        why it is missing. Only a started offer of the project's run, bound to this task, whose rule hands back a
        result is taken; an unknown, void or foreign offer is refused as TaskNotAnswered, and an offer whose task
        hands back no result (a reader's, or one of work that pushes) or is not at work as ResultRefused, both
        recording nothing. The result is checked before anything is saved: its format and kind match the rule, it
        names exactly the offer's issues, each once, every member follows the result format, and no text holds a
        control or direction character but a newline in a plan. Each issue must still belong to the offer, stand in
        the state the stage works in and be worked by an agent. A sound result is saved through the store in one save
        on the store as it stands, each issue moving from that state to the rule's done state; a result refused, or
        one missing, saves nothing and its issues stay where they stand, under Needs you once the task ended. One
        offer has one outcome: the first hand-in's - saved, missing, or the refusal with its faults - is recorded,
        and a second hand-in of the same offer answers it again and writes nothing, whatever it holds; a save that
        failed or did not end is recorded as a refusal, but for a store that refuses before it writes anything: busy
        or moved, which records nothing, so the same result is handed in again later; or without the person's access
        to the forge (NoForgeAccess), which keeps the result waiting, so the same result is handed in again once a
        token is handed on, even after the task's ENDED. A stage task's ENDED never moves its issues; an ENDED of an
        offer with no hand-in records its result as missing. The JSON body is at most 1052672 bytes. The changes stream
        announces the new board after a save.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageResultRequest'
      responses:
        '200':
          description: The offer's outcome, by this hand-in or an earlier one of the same offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResultReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '422':
          $ref: '#/components/responses/ResultRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'

  /projects/{project}/stories/{story}/work/stop:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    post:
      operationId: stopStoryWork
      summary: Cancel the run
      description: >-
        Takes an empty body, or one naming the run the person saw in `run`; a run named that is not the one standing,
        or a run named where none stands, is refused with the conflict RunChanged. Records cancellation of a run at
        work, ended with reasons or halted, and voids unstarted offers, retaining states, counts and findings; every
        reason then reads STOPPED. Active tasks stay at work until the window stops them and reports STOPPED or a
        late ENDED. Repeatable.
      tags: [work]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequest'
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryWorkReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/issues/{issue}/reading:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Issue'
    post:
      operationId: chooseReading
      summary: Choose how a stopped reading continues
      description: >-
        Checks story membership, stopped status, exact completed round and the versions `seen` holds for its targets:
        the issue and every deferred issue of the story it reconciles, so a window sends the versions of the story's
        issues. The choice clears the stop
        before an offer leaves. REVIEW_ANYWAY retains findings and saves the rule's done state. ONE_MORE_ROUND
        offers a reader in the Reading rule's first mode and model, granting one more reading only at the limit;
        REWORK offers rework with the saved blocking findings and the operator's words, which it requires only
        when no saved finding blocks, in the given mode, agent and model or else the Reworking rule's first ones.
        A reading stopped as INVALID_FINDINGS, whose findings could not be read, or by a reader that ended FAILED or
        BLOCKED, takes ONE_MORE_ROUND, a new reader of the same build, and REVIEW_ANYWAY; it refuses REWORK as
        ReworkNeedsFindings, since nothing guides it. It
        keeps no findings, as no other stopped reading does, so it is known by that once a failed choice has renamed
        its reason NEXT_STEP_UNAVAILABLE. Neither counts a reading. Stopped or halted runs refuse choices. The body
        is at most 65536 bytes.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingRequest'
      responses:
        '200':
          description: The current work and any still-valid offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingReply'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/RunConflict'
        '422':
          $ref: '#/components/responses/MoveRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

components:
  securitySchemes:
    signature:
      type: apiKey
      in: header
      name: Porelo-Signature
      description: >-
        The HMAC-SHA256 of the request under the token the planner was started with, as the description of the API
        gives its form; the token itself is never sent. A missing, malformed, repeated, late or replayed signature,
        or one over anything but the request as sent, answers 401.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: The project's name.
      schema:
        $ref: '#/components/schemas/Name'
    Story:
      name: story
      in: path
      required: true
      description: >-
        The story's identifier. The `#` of a tracker reference is percent-encoded in the path, `%23`, as is any other
        character a path segment cannot carry; the planner decodes the segment before it checks the id.
      schema:
        $ref: '#/components/schemas/StoryId'
    Issue:
      name: issue
      in: path
      required: true
      description: >-
        The issue's identifier. The `#` of a tracker reference is percent-encoded in the path, `%23`, as is any other
        character a path segment cannot carry; the planner decodes the segment before it checks the id.
      schema:
        $ref: '#/components/schemas/IssueId'

  responses:
    RunConflict:
      description: >-
        ItemChanged(changed[],items[]), BasisIncomplete(missing[]), WorkRunning(story,tasks[]),
        ReadingNotStopped(issue), ReadingRoundChanged(issue,rounds), ReworkNeedsFindings(issue),
        TaskEventConflict(task,event,reason) or RunChanged(story,reason). Subjects are checked before echoing. On a
        local project, also ItemsDirectoryRefused(directory) while the directory kept for its stories and issues, or its
        default directory, can no longer be used, as that response says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RecordUnavailable:
      description: >-
        Busy(repository) or WorkRecordUnavailable(project,reason). The record reason says why in words: fixed
        words and, where a directory or file was refused, that path named relative to the home directory (~/...)
        or to the state directory ($XDG_STATE_HOME/... or %LOCALAPPDATA%\...), never as an absolute path, and
        never the record's content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkRefused:
      description: >-
        InvalidName for an invalid path id (only a checked project may be echoed); InvalidSettings for malformed JSON,
        an oversized body, path/body disagreement or an unknown target state, with a fixed detail; WorkNotAllowed for
        a missing or unsound rule, disallowed from or mode, altered proposal facts, invalid choices or limits, or bounds;
        NoDiscussion for a discussion no sound rule offers an agent for, or whose brief is too long, with reason.
        WorkNotAllowed parameters are from, to and reason; to is always a known workflow state. A changed helper
        identity or brief has reason 'A helper identity or brief was changed.'. InvalidSettings parameters contain detail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkConflict:
      description: >-
        ItemChanged names the story when it changed since the version `seen` holds for it, with the story as it stands;
        BasisIncomplete names it when `seen` holds no version for it. WorkRunning names the checked story and an array
        of recorded active task names. RunChanged(story,reason) says in fixed words that the run a Start names in
        `replaces` or `passOver`, or the reason it passes over, is not the one standing, or that the run holds a reason
        a Start must pass over. The story's version is checked first; a story's state alone never means work is running.
        On a local project, also ItemsDirectoryRefused(directory) while the directory kept for its stories and issues,
        or its default directory, can no longer be used, as that response says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: >-
        The request carries no one valid signature, carries an Authorization header, or has a body larger than 267264
        bytes (1048576 bytes for POST on ideas, new stories and new issues, 1052672 bytes for a stage's result); the
        body is empty, and the answer carries no Porelo-Answer header.
      headers:
        WWW-Authenticate:
          description: Names the form of signature the planner expects.
          schema:
            type: string
            const: porelo-planner-request-1
    InvalidLevel:
      description: The level is none of ERROR, WARN, INFO and DEBUG (InvalidLevel); the level in force stays.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:InvalidLevel
            title: InvalidLevel
            status: 400
            detail: The level is none of ERROR, WARN, INFO, DEBUG.
    InvalidName:
      description: >-
        A project name, story id, issue id or query parameter was refused (InvalidName); its parameters name the
        project, unless the project's own name is the one refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:InvalidName
            title: InvalidName
            status: 400
            detail: The story id is not a valid id.
            parameters:
              project: example
    ProjectRefused:
      description: >-
        The project, its branch or its repository was refused: InvalidName for a project or branch name, NotACloneUrl
        for a repository that is not a clone URL.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            InvalidName:
              value:
                type: urn:porelo-planner:InvalidName
                title: InvalidName
                status: 400
                detail: The branch name is not a valid name.
                parameters:
                  project: example
            NotACloneUrl:
              value:
                type: urn:porelo-planner:NotACloneUrl
                title: NotACloneUrl
                status: 400
                detail: The repository is not a clone URL.
                parameters:
                  project: example
    NoSuchProject:
      description: The project was never made known with a PUT (NoSuchProject).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:NoSuchProject
            title: NoSuchProject
            status: 404
            detail: The project is not known.
            parameters:
              project: example
    NoSuchStory:
      description: The project is not known (NoSuchProject) or has no such story (NoSuchStory).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchProject:
              value:
                type: urn:porelo-planner:NoSuchProject
                title: NoSuchProject
                status: 404
                detail: The project is not known.
                parameters:
                  project: example
            NoSuchStory:
              value:
                type: urn:porelo-planner:NoSuchStory
                title: NoSuchStory
                status: 404
                detail: The project has no such story.
                parameters:
                  story: ST7
    NoSuchIssue:
      description: The project is not known (NoSuchProject) or has no such issue (NoSuchIssue).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchProject:
              value:
                type: urn:porelo-planner:NoSuchProject
                title: NoSuchProject
                status: 404
                detail: The project is not known.
                parameters:
                  project: example
            NoSuchIssue:
              value:
                type: urn:porelo-planner:NoSuchIssue
                title: NoSuchIssue
                status: 404
                detail: The project has no such issue.
                parameters:
                  issue: PL4
    StoreRefused:
      description: >-
        The store could not be read: the workflow is missing (WorkflowMissing), the Git login was refused
        (CredentialRefused), the person's access to the forge's API is missing or lacks a right (NoForgeAccess,
        naming the forge's address and, where the forge names it, the right), or a repository could not be read
        (Unreadable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            WorkflowMissing:
              value:
                type: urn:porelo-planner:WorkflowMissing
                title: WorkflowMissing
                status: 502
                detail: The project's repository holds no workflow.
                parameters:
                  repository: example
            CredentialRefused:
              value:
                type: urn:porelo-planner:CredentialRefused
                title: CredentialRefused
                status: 502
                detail: The Git login was refused for the repository.
                parameters:
                  repository: example
            NoForgeAccess:
              value:
                type: urn:porelo-planner:NoForgeAccess
                title: NoForgeAccess
                status: 502
                detail: The person's access to https://github.com lacks the right Projects
                parameters:
                  address: https://github.com
                  right: Projects
            Unreadable:
              value:
                type: urn:porelo-planner:Unreadable
                title: Unreadable
                status: 502
                detail: The repository could not be read.
                parameters:
                  repository: example
    Unreachable:
      description: A repository could not be reached (Unreachable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:Unreachable
            title: Unreachable
            status: 504
            detail: The repository could not be reached.
            parameters:
              repository: example

    NotUnlisted:
      description: >-
        The project is not known (NoSuchProject), or the board does not offer the issue to add, or the tracker no
        longer holds it (NotUnlisted, naming the issue); an issue on the board or outside its workflow answers so
        too, and the window reads the board again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchProject:
              value:
                type: urn:porelo-planner:NoSuchProject
                title: NoSuchProject
                status: 404
                detail: The project is not known.
                parameters:
                  project: example
            NotUnlisted:
              value:
                type: urn:porelo-planner:NotUnlisted
                title: NotUnlisted
                status: 404
                detail: The issue porelo-lib#7 is not offered to add to the project.
                parameters:
                  issue: porelo-lib#7
    NoSuchItem:
      description: NoSuchProject(project), NoSuchStory(story), NoSuchIssue(issue), or TaskNotAnswered(task,offer) for an unknown, void or foreign offer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NoSuchStory:
              value:
                type: urn:porelo-planner:NoSuchStory
                title: NoSuchStory
                status: 404
                detail: There is no story ST9.
                parameters:
                  story: ST9
            NoSuchIssue:
              value:
                type: urn:porelo-planner:NoSuchIssue
                title: NoSuchIssue
                status: 404
                detail: There is no issue PL9.
                parameters:
                  issue: PL9
    MoveConflict:
      description: >-
        WorkRunning(story,tasks[]) when a move touches an item currently owned by active work or moves an issue of a
        story whose run has a task at work. A target changed since the version `seen` holds for it (ItemChanged), a
        target has no version in `seen` (BasisIncomplete), or the batch's preview, computed again, answers another
        digest than the one sent (PreviewChanged, naming nothing the window could send back). A preview, which carries
        no versions, answers none of these. On a local project, also ItemsDirectoryRefused(directory) while the
        directory kept for its stories and issues, or its default directory, can no longer be used, as that response
        says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ItemChanged:
              value:
                type: urn:porelo-planner:ItemChanged
                title: ItemChanged
                status: 409
                detail: An item the write changes changed since it was read.
                parameters:
                  changed: [PL3]
                  items:
                    - id: PL3
                      gone: true
            BasisIncomplete:
              value:
                type: urn:porelo-planner:BasisIncomplete
                title: BasisIncomplete
                status: 409
                detail: The write names no version for an item it changes.
                parameters:
                  missing: [PL4]
            PreviewChanged:
              value:
                type: urn:porelo-planner:PreviewChanged
                title: PreviewChanged
                status: 409
                detail: What the moves would do changed since their preview; preview them again.
                parameters: {}
    CorrectionConflict:
      description: >-
        A target changed since the version `seen` holds for it (ItemChanged), a target has no version in `seen`
        (BasisIncomplete), or the correction's preview, computed again, answers another digest than the one sent
        (PreviewChanged). A preview, which carries no versions, answers none of these. On a local project, also
        ItemsDirectoryRefused(directory) while the directory kept for its stories and issues, or its default
        directory, can no longer be used, as that response says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ItemChanged:
              value:
                type: urn:porelo-planner:ItemChanged
                title: ItemChanged
                status: 409
                detail: An item the write changes changed since it was read.
                parameters:
                  changed: [PL3]
                  items:
                    - id: PL3
                      gone: true
            BasisIncomplete:
              value:
                type: urn:porelo-planner:BasisIncomplete
                title: BasisIncomplete
                status: 409
                detail: The write names no version for an item it changes.
                parameters:
                  missing: [PL4]
            PreviewChanged:
              value:
                type: urn:porelo-planner:PreviewChanged
                title: PreviewChanged
                status: 409
                detail: What the correction would do changed since its preview; preview it again.
                parameters: {}
    CorrectionRefused:
      description: >-
        A correction is refused (CorrectionRefused): the warning no longer stands on the item or the repository,
        another warning holds the item back (its words), the item's id names two items, the work rules have faults
        (their words), the choice is none of those the correction offers - a Labels takes none -, the repository is
        none of the project's, or the correction is a Move, which /moves carries out. Its `item` names the story,
        the issue or the repository. A body that cannot be read is refused as a move's is (MoveNotAllowed, "The
        body is no correction."), and so is an item that cannot be saved in its repository: an offered correction
        is still refused so when its head cannot be edited, and nothing is written; a repository's label call its
        forge refuses, and a read of its labels anew the forge refuses, is refused so too, named by the forge's
        status alone.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:CorrectionRefused
            title: CorrectionRefused
            status: 422
            detail: The warning no longer stands on it.
            parameters:
              item: ST4
              warning: StateOutsideWorkflow
              reason: The warning no longer stands on it.
    MoveRefused:
      description: >-
        A move is refused: its state is entered only by work and the item is a story, or an issue an agent works
        while a run in this planner's record works it or a story holding it (EnteredOnlyByWork), is no waiting or
        closed state
        (StateNotAllowed), or the move is not allowed (MoveNotAllowed): it names no item or one twice, closes a parent
        over an open sub-issue, completes a story while an issue of it stands neither in Review nor closed (its reason
        naming each such issue with its state), the work rules have faults, the body cannot be read, or the item cannot be saved in its
        repository.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            EnteredOnlyByWork:
              value:
                type: urn:porelo-planner:EnteredOnlyByWork
                title: EnteredOnlyByWork
                status: 422
                detail: >-
                  Building is entered only by its work while a run of this planner works the issue or its story.
                parameters:
                  item: PL1
                  to: Building
            StateNotAllowed:
              value:
                type: urn:porelo-planner:StateNotAllowed
                title: StateNotAllowed
                status: 422
                detail: The destination must be a configured waiting or closed state.
                parameters:
                  item: PL1
                  from: Backlog
                  to: Shipped
                  reason: The destination must be a configured waiting or closed state.
            MoveNotAllowed:
              value:
                type: urn:porelo-planner:MoveNotAllowed
                title: MoveNotAllowed
                status: 422
                detail: Its sub-issue PL4.1 stands in Backlog, which is not closed.
                parameters:
                  item: PL4
                  from: Review
                  to: Finished
                  reason: Its sub-issue PL4.1 stands in Backlog, which is not closed.
    SaveRefused:
      description: >-
        The store could not save: the store could not be read or written (WorkflowMissing, CredentialRefused,
        NoForgeAccess, Unreadable; an account whose Git has no name and email to commit with is refused as
        Unreadable, with words that say so). The Git store answers once its commits stand in its own clones and pushes afterwards, so a push
        a repository refuses becomes a fault on the board, never this answer; the mock mode answers PartlySaved, naming
        the repositories pushed and the one that failed, for a move of its fixed story over two repositories.
        A move is written one issue after another, so it is not all or none when another changes one of its issues
        meanwhile at a place the move writes: it then answers PartlySaved, `issues` naming each issue that stands with
        its state (`id=state`, comma-joined) and `pushed` the repositories that hold them.
        LabelsNotKept (repository, item) when the tracker, read back after a write of labels, does not carry exactly
        the labels sent, in any case - the topic labels asked and the person's own -, as GitHub drops them without an
        error for an account that may not set them; what else the write saved stands.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            PartlySaved:
              value:
                type: urn:porelo-planner:PartlySaved
                title: PartlySaved
                status: 502
                detail: The repository refused the push.
                parameters:
                  pushed: porelo-other
                  failed: porelo-project
                  issues: PL1=Building
            CredentialRefused:
              value:
                type: urn:porelo-planner:CredentialRefused
                title: CredentialRefused
                status: 502
                detail: The Git login was refused for the repository.
                parameters:
                  repository: example
            NoForgeAccess:
              value:
                type: urn:porelo-planner:NoForgeAccess
                title: NoForgeAccess
                status: 502
                detail: The person's access to https://github.com is missing or refused
                parameters:
                  address: https://github.com
            LabelsNotKept:
              value:
                type: urn:porelo-planner:LabelsNotKept
                title: LabelsNotKept
                status: 502
                detail: The tracker did not keep the labels asked.
                parameters:
                  repository: porelo-lib
                  item: porelo-lib#12
    IssueConflict:
      description: >-
        A target of the write changed since the version `seen` holds for it (ItemChanged, naming each such target and
        answering it as it stands, or gone), or `seen` holds no version for a target (BasisIncomplete, naming each). On
        a local project, also ItemsDirectoryRefused(directory) while the directory kept for its stories and issues, or
        its default directory, can no longer be used, as that response says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ItemChanged:
              value:
                type: urn:porelo-planner:ItemChanged
                title: ItemChanged
                status: 409
                detail: An item the write changes changed since it was read.
                parameters:
                  changed: [PL3]
                  items:
                    - id: PL3
                      gone: true
            BasisIncomplete:
              value:
                type: urn:porelo-planner:BasisIncomplete
                title: BasisIncomplete
                status: 409
                detail: The write names no version for an item it changes.
                parameters:
                  missing: [PL4]
    EditConflict:
      description: >-
        A target of the write changed since the version `seen` holds for it, on the tracker too where the store keeps
        one (ItemChanged, naming each such target and answering it as it stands, or gone), `seen` holds no version for a
        target (BasisIncomplete, naming each), or a started task of a run works an issue the change takes out of its
        story or an issue a new story would take, or a run whose story is gone still has a task at work (WorkRunning,
        naming the story and its tasks, and for a new story over issues that stand the issue named that the run works,
        itself or through a sub-issue), or an issue a new story would take belongs to another story (IssueInStory,
        naming the issue, the story holding it - by its id on the board, by its tracker reference when the board does
        not hold it, or empty when neither is known - and the field of the request that named the issue). On a local
        project, also ItemsDirectoryRefused(directory) while the directory kept for its stories and issues, or its
        default directory, can no longer be used, as that response says.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ItemChanged:
              value:
                type: urn:porelo-planner:ItemChanged
                title: ItemChanged
                status: 409
                detail: An item the write changes changed since it was read.
                parameters:
                  changed: [PL3]
                  items:
                    - id: PL3
                      gone: true
            BasisIncomplete:
              value:
                type: urn:porelo-planner:BasisIncomplete
                title: BasisIncomplete
                status: 409
                detail: The write names no version for an item it changes.
                parameters:
                  missing: [PL4]
            WorkRunning:
              value:
                type: urn:porelo-planner:WorkRunning
                title: WorkRunning
                status: 409
                detail: The story already has active work.
                parameters:
                  story: ST7
                  tasks: [porelo-task-1]
            IssueInStory:
              value:
                type: urn:porelo-planner:IssueInStory
                title: IssueInStory
                status: 409
                detail: The issue belongs to another story; an issue has one story.
                parameters:
                  issue: porelo-lib#12
                  story: ST3
                  field: existing[0]
    IssueRefused:
      description: >-
        A new issue is refused (IssueNotAllowed): the body is no new issue or is larger than 1048576 bytes (field
        empty), or a field is out of bounds (field repository, title, mustBeTrue, size, worker, seen, task,
        priority, story, confirm or labels, a name outside the topic labels among them), or the store cannot write it in its repository, such as a repository whose
        issues give no prefix (field empty) or a body longer than GitHub takes (field mustBeTrue, final: the same
        text is refused again). A GitHub create's initial placement is refused before creation with
        StateNotAllowed for an unknown or closed state, EnteredOnlyByWork for an agent's issue entering a working
        state while a run in this planner's record works its story, or
        MoveNotAllowed for another move refusal; item is empty. A state the workflow lacks is refused with
        StateNotAllowed on every store before anything is created. What was sent is never repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:IssueNotAllowed
            title: IssueNotAllowed
            status: 422
            detail: The title must have 1 to 256 characters.
            parameters:
              field: title
              reason: The title must have 1 to 256 characters.
    IdeaRefused:
      description: >-
        An idea is refused (IdeaRefused), with fixed words; what was sent is never repeated, but for a refused
        issue's repository: the first such fault names the project's repositories allowed and each later one refers to
        them, and each names the value sent only when it
        is a well-formed repository name (at most 100 of a-z, 0-9, '.', '_' and '-', starting with a letter or digit).
        The body is no hand-in or
        no new story - larger than 1048576 bytes (65536 for a story from existing issues), not JSON, not an object, a member missing or unknown, offer no
        lowercase UUID, or seen no object of versions by item id - with one fault; or the idea breaks the idea format, at most 100
        faults, each starting with the field it names (story, story.title, issues, issues[0].repository, existing,
        existing[0], counted from 0), an existing issue refused naming its id; or the store cannot write it, its words as the one fault, starting with the field that named the issue when it refuses one; or the offer's save is still pending or was only
        partly pushed, with pushed naming the repositories already pushed (comma-joined, empty when none).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Malformed:
              value:
                type: urn:porelo-planner:IdeaRefused
                title: IdeaRefused
                status: 422
                detail: The idea does not follow the idea format.
                parameters:
                  faults:
                    - 'story.title: The title must be one line of 1 to 256 characters.'
                    - 'issues[1].worker: The worker must be Agent or Manual.'
            PartlySaved:
              value:
                type: urn:porelo-planner:IdeaRefused
                title: IdeaRefused
                status: 422
                detail: The idea of this offer was saved only in part and is not saved again.
                parameters:
                  pushed: porelo-other
                  faults:
                    - 'offer: The idea of this offer was saved only in part and is not saved again.'
    EditRefused:
      description: >-
        A change of an issue's fields, a story's issues, an issue's blockers or an item's title and text, or a
        comment, is refused, with fixed words; what was sent is never repeated. EditNotAllowed (item, field, reason)
        when the body is not that change - not one JSON object of its size, a member unknown, missing or of another
        kind, a value out of its bounds - or the change breaks the board: an issue or blocker named twice, an issue of
        another story or a sub-issue of an issue hung into a story, a story the board shows only in part given a whole
        list, an issue blocking itself, blockers that lead back to the issue, a comment opening with the planner's own
        marker `<!-- porelo:`, a title of more than one line, a part that would open a part of its own or leave a
        block open, a body grown past what the tracker takes, a body whose sections cannot be told apart, or an issue
        made outside the project the board could not show once added, with what to repair. LabelNotAllowed (item,
        label) when labels names a name outside the topic labels; label is the name got when it is a well-formed
        LabelName, the one thing sent that a refusal repeats, and empty otherwise. MoveNotAllowed (item, from, to, reason) when the store cannot write it, with the store's words, such as an
        issue a story holds only under Also needs in its body taken out, an issue that has a parent on the tracker
        hung in, or a call the tracker refused, named by its status alone.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            EditNotAllowed:
              value:
                type: urn:porelo-planner:EditNotAllowed
                title: EditNotAllowed
                status: 422
                detail: The blockers lead back to the issue through PL4.
                parameters:
                  item: PL3
                  field: blockedBy
                  reason: The blockers lead back to the issue through PL4.
            LabelNotAllowed:
              value:
                type: urn:porelo-planner:LabelNotAllowed
                title: LabelNotAllowed
                status: 422
                detail: The planner sets only the topic labels.
                parameters:
                  item: PL3
                  label: bug
            MoveNotAllowed:
              value:
                type: urn:porelo-planner:MoveNotAllowed
                title: MoveNotAllowed
                status: 422
                detail: GitHub refused the call with status 422
                parameters:
                  item: PL3
                  from: ''
                  to: ''
                  reason: GitHub refused the call with status 422
    ResultRefused:
      description: >-
        A stage's hand-in is refused (ResultRefused), with fixed words; what was sent is never repeated. The body is
        no hand-in - larger than 1052672 bytes, not JSON, not an object, a member unknown, offer no lowercase UUID, or
        neither or both of result and missing - with one fault; or the offer takes no result now, with one fault
        starting with offer; or the result breaks the result format, at most 10 faults, each starting with the field
        it names (format, kind, issues, issues[0].plan, issues[0].toBeChecked[1], missing, counted from 0); or an
        issue no longer belongs to the offer, stands in another state or is worked by a person, with one fault
        starting with issues; or the store did not save it, or its save did not end, with one fault starting with
        result. Every refusal of an offer that takes a result is its recorded outcome, answered again to a second
        hand-in of the offer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Malformed:
              value:
                type: urn:porelo-planner:ResultRefused
                title: ResultRefused
                status: 422
                detail: The result does not follow the result format.
                parameters:
                  faults:
                    - 'issues[0].size: The size must be one of XS, S, M, L, XL.'
                    - 'issues[0].plan: An analysis needs a plan.'
    PriorityRefused:
      description: >-
        A project name or story id was refused (InvalidName), or the body is no priority change (PriorityNotAllowed,
        naming the story): not one JSON object of at most 65536 bytes with exactly the members seen and priority,
        one of the five priorities. What was sent is never repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            InvalidName:
              value:
                type: urn:porelo-planner:InvalidName
                title: InvalidName
                status: 400
                detail: The story id is not a valid id.
                parameters:
                  project: example
            PriorityNotAllowed:
              value:
                type: urn:porelo-planner:PriorityNotAllowed
                title: PriorityNotAllowed
                status: 400
                detail: The priority must be Highest, High, Medium, Low or Lowest.
                parameters:
                  story: ST7
    ItemsDirectoryRefused:
      description: >-
        A local project's directory for its stories and issues was refused (ItemsDirectoryRefused): on PUT
        /projects/{project}/tracker/items with 400, the directory chosen or the body; with 409 on every call that
        reads or writes the project's stories and issues, among them GET /projects/{project}/events when the first
        read is refused before the stream starts, while the directory kept, or the default directory, can no longer
        be used. The planner never reads or writes the default directory in place of a kept one meanwhile. `detail`
        is exactly one of these phrases, never words of the system or a link's target: "The directory does not
        exist.", "The path is not a directory.", "The path is or passes through a symbolic link.", "The directory is
        not this account's alone.", "The path is not an absolute path in normal form.", "The path is longer than 4095
        bytes in UTF-8.", "The body is not one JSON object of at most 8192 bytes with exactly the members directory
        and seen.", or "The kept choice of directory is not one the planner wrote.". `parameters.directory` names
        the directory only when it is an ItemsDirectory; a body refused, or a directory that is no ItemsDirectory, is
        refused without it. On the PUT, `parameters.project` names the project.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:ItemsDirectoryRefused
            title: ItemsDirectoryRefused
            status: 400
            detail: The directory does not exist.
            parameters:
              project: example
              directory: /home/person/planning
    NotOffered:
      description: >-
        This planner's store saves no moves, adds no issues, saves no workers, saves no priorities, adds no ideas or
        stories, sets no issue's fields, story's issues, issue's blockers or item's title and text, writes no comment,
        adds no issue made outside the project, saves no stage's result or offers no correction of the warning named,
        a repository's Labels by a store that holds no repository's labels among them; the Git store sets no item's
        labels, on an edit or a new issue; the mock mode previews and saves moves, saves workers, adds ideas and
        stories and takes the edits by hand, labels among them, into its in-memory board, but adds no issues, adds no
        issue made outside the project and saves no priorities
        (NotOffered).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:NotOffered
            title: NotOffered
            status: 501
            detail: This planner does not save moves.
            parameters:
              project: example
    Busy:
      description: Another save or a fetch held the project longer than the planner waits (Busy).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:porelo-planner:Busy
            title: Busy
            status: 503
            detail: The project is busy with another save; try again.
            parameters:
              repository: porelo-project

  schemas:
    Name:
      description: The name of a project or a repository.
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,99}$'
    StoryId:
      description: >-
        A story's identifier in one of two forms: the Git store's, ST and a number, or a tracker reference within the
        project, `<repository>#<number>`, the repository's name as Name takes it, without `..`, and the tracker's
        number of one to nine digits without a leading zero. A store answers only its own form.
      type: string
      pattern: '^(ST[0-9]{1,5}|(?![^#]*\.\.)[a-z0-9][a-z0-9._-]{0,99}#[1-9][0-9]{0,8})$'
    TextFormat:
      description: >-
        The format a store writes its texts in, an open name: MARKDOWN for the Git store, PLAIN, or a store's own. A
        reader shows a format it does not know as plain text.
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,31}$'
    IssueId:
      description: >-
        An issue's identifier in one of two forms: the Git store's, a prefix and a number, with a sub-issue's number
        after a dot, or a tracker reference within the project, `<repository>#<number>`, the repository's name as
        Name takes it, without `..`, and the tracker's number of one to nine digits without a leading zero. A store
        answers only its own form.
      type: string
      pattern: '^([A-Z]{1,4}[0-9]{1,5}(\.[0-9]{1,3})?|(?![^#]*\.\.)[a-z0-9][a-z0-9._-]{0,99}#[1-9][0-9]{0,8})$'
    RunId:
      description: >-
        A story's run, drawn by the planner when the run starts and kept while it stands; opaque to the window, which
        compares it only for equality.
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Revision:
      description: >-
        The store's revision the answer was read at; opaque to the window, which compares it only for equality. At
        most 200 printable characters without spaces, however many repositories the project has, since the window
        sends it back as the `Last-Event-ID` header; the Git store gives a SHA-256 as 64 lower-case hexadecimal
        characters.
      type: string
      pattern: '^[!-~]{1,200}$'

    Version:
      description: >-
        An item's own stored edit basis, opaque to the window, which compares it only for equality: two equal versions
        of one item mean its own stored state is unchanged. A value it takes from another item, such as a sub-issue's
        inherited worker or a story's state its issues give, is not part of it; neither is a comment or another
        item's change. 40 or 64 lower-case hexadecimal characters: the Git store gives the id of an item's file in
        Git where it has one, and otherwise, as every other store, a SHA-256 of the item's own stored state.
      type: string
      pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'

    Seen:
      description: >-
        The versions the person saw, by item id: the edit basis a write is checked against. The planner determines
        the write's targets, the items whose own stored state it changes, each request schema naming them; a target
        whose version here differs from the one it stands at is refused (ItemChanged), and a target without an entry
        is refused (BasisIncomplete), never taken as one not to check. An entry for an item that is no target is not
        checked, so a window may send the version of every item it showed. Always present; `{}` for a write without
        targets. At most 2000 entries, so the check of one write never holds an unbounded map: the most targets a write
        can name, a full batch of moves each carrying its story's issues, is far larger, while a window sends the
        versions of the items it acts on; an object of more entries is refused like one that names no versions.
      type: object
      maxProperties: 2000
      propertyNames:
        anyOf:
          - $ref: '#/components/schemas/IssueId'
          - $ref: '#/components/schemas/StoryId'
      additionalProperties:
        $ref: '#/components/schemas/Version'

    LabelName:
      description: >-
        A label's name as the tracker holds it: 1 to 50 characters, GitHub's own limit, without a control character, a
        character that hides or turns text - a format, zero-width or bidi character, a soft hyphen (U+00AD), a
        combining grapheme joiner (U+034F), the Mongolian vowel separator (U+180E) or a tag character (U+E0000 to
        U+E007F) -, or a line or paragraph separator. The pattern is read without the u flag, so a tag character
        stands in it as its UTF-16 surrogate pair.
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^(?:(?!\uDB40[\uDC00-\uDC7F])[^\x00-\x1f\x7f-\x9f\xad\u034f\u061c\u180e\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u206f\ufeff\u2028\u2029]){1,50}$'
    Labels:
      description: >-
        An item's labels on its tracker, in the store's order, each at most once: the topic labels and any label of
        the person's own, which the planner shows and keeps but never sets. A label the tracker holds whose name is
        no LabelName is left out here and stays on the tracker, never written. Empty where the store holds none, as
        the Git store.
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/LabelName'
    TopicLabel:
      description: One of the seven topic labels every repository of a project carries, the labels the planner sets.
      type: string
      enum: [documentation, security, tests, build, dependencies, performance, usability]
    TopicLabels:
      description: >-
        The topic labels an item carries after the write, each at most once: a topic label named is put on, one left
        out is taken off, and a label outside the topic labels that the item carries already stays as it is. A name
        outside the topic labels is refused, as LabelNotAllowed on an edit and as IssueNotAllowed (field labels) on a
        new issue, and so is a name given twice (EditNotAllowed or IssueNotAllowed, field labels).
      type: array
      maxItems: 7
      uniqueItems: true
      items:
        $ref: '#/components/schemas/TopicLabel'

    Target:
      description: An item a write changes, with the version it stands at.
      type: object
      required: [id, version]
      properties:
        id:
          description: An issue's or a story's id.
          anyOf:
            - $ref: '#/components/schemas/IssueId'
            - $ref: '#/components/schemas/StoryId'
        version:
          $ref: '#/components/schemas/Version'

    ChangedItem:
      description: >-
        A target an ItemChanged refusal names, as the store holds it now: exactly one of issue, story and unlisted,
        with gone false; or gone true and none of them when the store holds no one readable item by that id any more.
      type: object
      required: [id, gone]
      properties:
        id:
          type: string
        gone:
          type: boolean
        issue:
          $ref: '#/components/schemas/Issue'
        story:
          $ref: '#/components/schemas/Story'
        unlisted:
          $ref: '#/components/schemas/UnlistedIssue'

    Level:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [ERROR, WARN, INFO, DEBUG]
          description: How much the planner's log holds, the least first; INFO when none was set.

    Health:
      type: object
      required: [status, version, commit]
      properties:
        status:
          type: string
          const: UP
        version:
          description: The planner's package version, as its .deb and .rpm carry it.
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}(~snapshot\.(0|[1-9][0-9]*))?$'
          examples: ['0.1.0~snapshot.36']
        commit:
          description: The commit the planner was built from; null for a build without a Git checkout.
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'

    ProofRequest:
      description: A caller's challenge, 32 random bytes in canonical base64url without padding.
      type: object
      required: [challenge]
      additionalProperties: false
      properties:
        challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'

    Proof:
      description: The planner's proof that it holds the token, for the port it listens on and the challenge.
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'

    ProjectSource:
      description: Where a project's planning is kept.
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          description: >-
            The project's own repository's clone URL, as https://host/path, ssh://[user@]host/path or user@host:path.
        branch:
          type: string
          description: The branch to read and write; the repository's default branch when absent.

    Workflow:
      description: A project's workflow.
      type: object
      required: [revision, states, phases, work, faults, reasons, tracker]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        tracker:
          $ref: '#/components/schemas/Tracker'
        states:
          type: array
          description: The states in workflow order.
          items:
            $ref: '#/components/schemas/State'
        phases:
          type: array
          description: The board's columns in order.
          items:
            $ref: '#/components/schemas/Phase'
        work:
          type: array
          description: The sound work rules.
          items:
            $ref: '#/components/schemas/WorkRule'
        faults:
          type: array
          description: >-
            What was found wrong reading the workflow, and each story, issue or reference left out because it could
            not be read, in the planner's words. The rest of the board is answered.
          items:
            type: string
        reasons:
          type: boolean
          description: >-
            Whether the store keeps a move's `reason` with the item it closes; a window offers the reason only when
            true and reads an answer without it as false.
    State:
      description: One state of the workflow.
      type: object
      required: [name, kind, measured]
      properties:
        name:
          type: string
        kind:
          type: string
          description: >-
            CLOSED when the workflow closes the state, WORKING when a sound work rule exists for it, else WAITING.
          enum: [WAITING, WORKING, CLOSED]
        measured:
          type: boolean
          description: >-
            Whether moving an issue into the state needs a stage record. An open story's state is derived from its
            issues by the measured states alone: building starts in the first measured open state, the open state
            before it is the backlog, and a story waits for review in the last of the measured open states that run
            on from there.
    Phase:
      description: One column of the board and its states.
      type: object
      required: [name, states]
      properties:
        name:
          type: string
        states:
          type: array
          description: The names of the column's states, in order.
          items:
            type: string
    WorkRule:
      description: How work is done in a working state.
      type: object
      required: [state, from, done, then, blocked, per, modes, order, models]
      properties:
        state:
          type: string
          description: The working state.
        from:
          type: array
          description: The states work may start from.
          items:
            type: string
        done:
          type: string
          description: The state a story or issue reaches when the work is done.
        then:
          type: [string, 'null']
          description: The state that follows the done state, or null when none does.
        blocked:
          type: [string, 'null']
          description: The state a blocked work goes to, or null when none is named.
        per:
          type: string
          description: Whether one task works the whole story or one each repository.
          enum: [story, repository]
        modes:
          type: array
          description: The ways the work may run, such as SHELL, AGENT or UNATTENDED.
          items:
            type: string
        order:
          type: string
          description: The work order given to the task.
        models:
          type: object
          description: The model for each agent, in order of preference.
          additionalProperties:
            type: string

    Board:
      description: >-
        The whole board at one revision, as an event of the stream carries it - the workflow, the project's
        repositories and the stories.
      type: object
      required: [revision, states, phases, work, faults, reasons, repositories, repositoryWarnings, stories, open, tracker]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        tracker:
          $ref: '#/components/schemas/Tracker'
        repositories:
          type: array
          description: >-
            The project's repositories, its own first, the others in the order project.yml names them; a new issue
            may be added in each of them, whether or not a story names an issue of it.
          items:
            $ref: '#/components/schemas/Name'
        repositoryWarnings:
          type: array
          maxItems: 100
          description: >-
            What the store found wrong in the project's repositories themselves, at most one warning of a kind per
            repository, in the order of `repositories`; empty when nothing. The GitHub store compares each
            repository's labels with the topic labels at the project's first read and at each Refresh, and one
            repository's again at the preview and the confirm of its correction, and keeps what it found between
            them, so a plain read of the board reads no repository's labels; a store that
            holds no repository's labels, the Git and the local store, answers it empty.
          items:
            $ref: '#/components/schemas/RepositoryWarning'
        states:
          type: array
          description: The states in workflow order.
          items:
            $ref: '#/components/schemas/State'
        phases:
          type: array
          description: The board's columns in order.
          items:
            $ref: '#/components/schemas/Phase'
        work:
          type: array
          description: The sound work rules.
          items:
            $ref: '#/components/schemas/WorkRule'
        faults:
          type: array
          description: >-
            What was found wrong reading the workflow, and each story, issue or reference left out because it could
            not be read, in the planner's words. The rest of the board is answered.
          items:
            type: string
        reasons:
          type: boolean
          description: >-
            Whether the store keeps a move's `reason` with the item it closes; a window offers the reason only when
            true and reads an answer without it as false.
        stories:
          type: array
          description: Every story, without its description.
          items:
            $ref: '#/components/schemas/Story'
        unlisted:
          type: array
          description: >-
            The open issues of the project's repositories that are no items of the project, as one made by hand on
            the tracker is, in the order of the repositories. None of them is on the board. Empty
            when there are none; a store without a tracker answers it empty, and a window reads an answer without it
            as empty.
          items:
            $ref: '#/components/schemas/UnlistedIssue'
        open:
          description: What is still open of the whole board, as the story list answers it.
          allOf:
            - $ref: '#/components/schemas/OpenWork'
        rules:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: array
          description: >-
            Every breach of the stories' rules on this board, the stories' in the board's order and then the issues',
            the same rules whichever store keeps the project. Unlike `faults`, a breach leaves nothing out, and it is
            only shown: no move, preview or save reads it, and none is refused or warned for it. Only the whole board
            carries it; a window that reads none shows none.
          items:
            $ref: '#/components/schemas/RuleBreach'

    RuleBreach:
      description: >-
        One breach of the stories' rules. IssueInNoStory - an issue that is not closed stands in a state past the
        workflow's first and in no story, directly or under a parent. StoryPriorityBelowIssue - a story's priority is
        below the highest priority of its open issues, its sub-issues included; an issue without a priority is not
        ranked.
      type: object
      required: [item, rule, words]
      properties:
        item:
          description: The story's or the issue's id.
          type: string
        rule:
          type: string
          enum: [IssueInNoStory, StoryPriorityBelowIssue]
        words:
          type: string
          description: The breach in the planner's fixed words, naming items only by their ids.

    UnlistedIssue:
      description: >-
        An open issue of one of the project's repositories that is no item of the project. Its title is the
        tracker's text, shown as plain text.
      type: object
      required: [id, repository, title, kind, link, version]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        id:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        title:
          type: string
        kind:
          type: string
          pattern: '^[a-z][A-Za-z]{0,63}$'
          description: >-
            An open name of what the issue is; a window shows a kind it does not know as an issue. Known kinds are
            story, when the tracker's issue type is Story and the issue is in the project's own repository, and
            issue otherwise.
        link:
          type: string
          format: uri
          description: The issue on the tracker, built from its repository and number.
        author:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: string
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}(?:\[bot\])?$'
          description: >-
            The login of the account that opened the issue, shown as plain text; left out when the tracker named none
            of a login's form, as for an account the tracker no longer holds; the window then shows no author.
        authorAssociation:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: string
          enum: [OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, MANNEQUIN, NONE]
          description: >-
            How that account stands to the issue's repository, as the tracker names it, shown as plain text; left out
            when the tracker named none of these; the window then shows none.

    Moves:
      description: >-
        A batch of moves with the versions seen, its preview's targets, and the digest of its preview; a batch that
        confirms its warnings may leave the digest out, and the planner's preview of the same moves stands for it.
      type: object
      required: [seen, moves]
      properties:
        seen:
          $ref: '#/components/schemas/Seen'
        moves:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Move'
        digest:
          $ref: '#/components/schemas/PreviewDigest'
        confirm:
          type: boolean
          default: false
          description: >-
            Whether the person confirmed the preview's warnings: each run its RUNNING_WORK warning named is stopped
            with the save.
    MovesPreviewRequest:
      description: A batch of moves to preview against the board as the planner reads it; it carries no versions.
      type: object
      required: [moves]
      properties:
        moves:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Move'
    PreviewDigest:
      description: >-
        A SHA-256 over what a preview showed, as 64 lower-case hexadecimal characters; opaque to the window, which only
        sends it back with the save.
      type: string
      pattern: '^[0-9a-f]{64}$'
    MovePreview:
      description: What a batch of moves would write, and what a person confirms before it is saved.
      type: object
      required: [revision, digest, issues, stories, warnings, targets]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        digest:
          $ref: '#/components/schemas/PreviewDigest'
        targets:
          type: array
          description: >-
            Every issue and story the batch changes, each once with the version it stands at: those it moves and the
            issues a story's move carries along. The save sends them back in `seen`.
          items:
            $ref: '#/components/schemas/Target'
        issues:
          type: array
          description: Every issue the batch moves, each once, in the order the save names them.
          items:
            $ref: '#/components/schemas/MovedIssue'
        stories:
          type: array
          description: Every story the batch moves.
          items:
            $ref: '#/components/schemas/MovedStory'
        warnings:
          type: array
          description: >-
            What the batch can do harm by; empty when it is saved without asking. A window lists under RUNNING_WORK
            too the tasks it started that the planner does not know yet; the digest does not cover those.
          items:
            $ref: '#/components/schemas/MoveWarning'
    MovedIssue:
      description: An issue a batch moves, or one a warning names, with its state now and after the batch.
      type: object
      required: [id, repository, from, to]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        from:
          type: string
        to:
          type: string
    MovedStory:
      description: A story a batch moves, with the state it shows now and the one it is moved to.
      type: object
      required: [id, from, to]
      properties:
        id:
          $ref: '#/components/schemas/StoryId'
        from:
          type: string
        to:
          type: string
    MoveWarning:
      description: >-
        One harm a batch can do. RUNNING_WORK - a story's run has tasks at work over what moves, the story itself or an issue of it: item is the story,
        run its run, tasks each task at work and offers each offer not yet started, all of which its stop ends or
        voids; an unconfirmed save is refused (WorkRunning), a confirmed one stops them. ISSUES_ALONG - a story's
        move carries issues along that stand in a working state or in another repository than the project's own: item is the story,
        issues each such issue. SKIPS_STATES - a move forward past waiting states: item is the story or issue, from
        and to its states, skipped the states passed.
      type: object
      required: [kind, item, from, to, run, tasks, offers, issues, skipped]
      properties:
        kind:
          type: string
          enum: [RUNNING_WORK, ISSUES_ALONG, SKIPS_STATES]
        item:
          type: string
          description: The story or issue the warning is about.
        from:
          type: string
          description: The item's state now.
        to:
          type: string
          description: The state the batch moves the item to.
        run:
          description: The run whose tasks RUNNING_WORK names, or null.
          oneOf:
            - $ref: '#/components/schemas/RunId'
            - type: 'null'
        tasks:
          type: array
          items:
            type: string
        offers:
          type: array
          items:
            type: string
            format: uuid
        issues:
          type: array
          items:
            $ref: '#/components/schemas/MovedIssue'
        skipped:
          type: array
          items:
            type: string
    Move:
      description: >-
        One move, naming exactly one story or one issue. A story is moved only to close it or, once closed, to
        reopen it: an open story follows its issues, and its move to another open state is refused (MoveNotAllowed).
        Its move to the workflow's first closed state closes it as completed and closes with it each of its issues
        in Review; to a later closed state, closes it as not planned and closes with it each of its issues in an open
        state of the workflow. Its move to an open state reopens it alone.
      type: object
      required: [to]
      properties:
        story:
          $ref: '#/components/schemas/StoryId'
        issue:
          description: >-
            An issue of the board. One warned StateOutsideWorkflow moves from the state it stands in into a state of
            the workflow, which repairs it, under the same rules as any issue (a working state only for an issue a
            person works or one no run in this planner's record works).
          allOf:
            - $ref: '#/components/schemas/IssueId'
        to:
          type: string
          description: The state it moves to.
        reason:
          type: string
          description: >-
            The person's one sentence why the item is closed: what was built, or why not. Taken only on a move into a
            closed state and optional there, a blank one counting as none; a story's reason is given to each issue the
            same move closes; when the story stands in that state already, the same move sent again, each issue of it
            standing there too keeps it, so a comment that failed is written then; an issue's own move in the batch
            keeps its own reason or none. It holds at most 280 code points after trimming and no control, format,
            surrogate, unassigned or private-use character, no line or paragraph separator, and none of U+115F, U+2800
            or U+3164, which show as blank; it is refused
            (MoveNotAllowed, whose own `reason` parameter is the planner's words, not this text) on a move into a
            state that is not closed, on an issue move whose issue stands in that state already,
            and on a store that keeps no reasons, before anything is written.
    Moved:
      description: >-
        The board's revision after the save, every issue the batch moved, each once, and every run a confirmed save
        stopped.
      type: object
      required: [revision, moved, stopped]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        moved:
          type: array
          items:
            $ref: '#/components/schemas/IssueId'
        stopped:
          type: array
          description: Each run the save stopped; empty when it stopped none.
          items:
            $ref: '#/components/schemas/StoppedRun'
    StoppedRun:
      description: A run a confirmed save of moves stopped, with each task at work the window must end.
      type: object
      required: [story, run, tasks]
      properties:
        story:
          $ref: '#/components/schemas/StoryId'
        run:
          $ref: '#/components/schemas/RunId'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/StoppedTask'
    StoppedTask:
      description: A task at work whose run a confirmed save of moves stopped, which the window ends.
      type: object
      required: [task, containerId]
      properties:
        task:
          type: string
        containerId:
          type: string

    Tracker:
      description: Where the planner keeps a project's stories and issues.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [github, git, local]
          description: >-
            `local` when the planner keeps them in a directory of this computer, which the person may choose;
            `github` when GitHub's tracker keeps them, as the mock mode answers too; `git` when the Git store keeps
            them as Markdown files in the project's repository.
        items:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          allOf:
            - $ref: '#/components/schemas/ItemsDirectory'
          description: >-
            Present only for `local`: the directory the planner uses, the default included. It is named absolute,
            unlike a path in a refusal's reason, since it is the person's own choice, shown to them and offered as
            where a folder dialog opens, and the answer goes only over loopback to a signed request. A kept or
            default directory that is no ItemsDirectory is never answered here: the project's reads are refused as
            ItemsDirectoryRefused instead.
        default:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          allOf:
            - $ref: '#/components/schemas/ItemsDirectory'
          description: >-
            Present only for `local`: the project's default directory, which `items` equals while no other directory
            is kept and which a PUT of `null` goes back to; a window offers going back to it only while `items`
            differs.
    ItemsDirectoryRequest:
      description: >-
        The directory a local project's stories and issues are kept in, with the versions seen; it has no target. No
        other member is taken, and no member twice.
      type: object
      additionalProperties: false
      required: [directory, seen]
      properties:
        directory:
          oneOf:
            - $ref: '#/components/schemas/ItemsDirectory'
            - type: 'null'
          description: The directory, or an explicit null for the default directory.
        seen:
          $ref: '#/components/schemas/Seen'
    ItemsDirectory:
      description: >-
        A directory of this computer as an absolute path in normal form, the same rule for the planner and the
        window: at most 4095 bytes in UTF-8; no `.` or `..` segment, no empty segment such as `//`, and no trailing
        separator, the root alone excepted; no C0 or C1 control character (U+0000 to U+001F, U+007F to U+009F, U+0085
        among them), no U+2028 or U+2029, no bidirectional control (U+202A to U+202E, U+2066 to U+2069), and no
        unpaired surrogate; no white space at its start or end, which is refused, never trimmed. On Linux it starts
        with `/`. On Windows it is a drive path, a letter, `:` and `\`, with `\` as its only separator; a UNC or
        device path (`\\server\...`, `\\.\...`, `\\?\...`) is refused.
      type: string
      minLength: 1
      maxLength: 4095
    Worker:
      description: Who works an issue, an agent through the tasks the planner starts or a person by hand.
      type: string
      enum: [AGENT, MANUAL]
    WorkerRequest:
      description: An issue's new worker, with the versions seen; its target is the issue. No other member is taken.
      type: object
      additionalProperties: false
      required: [worker, seen]
      properties:
        worker:
          $ref: '#/components/schemas/Worker'
        seen:
          $ref: '#/components/schemas/Seen'
    WorkerSaved:
      description: The board's revision after the save.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    Priority:
      description: A story's priority, the highest first.
      type: string
      enum: [Highest, High, Medium, Low, Lowest]
    PriorityRequest:
      description: A story's new priority, with the versions seen; its target is the story. No other member is taken.
      type: object
      additionalProperties: false
      required: [priority, seen]
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        seen:
          $ref: '#/components/schemas/Seen'
    PrioritySaved:
      description: The board's revision after the save.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    NewIssueRequest:
      description: An idea a person wrote, with the versions seen; its target is the story named, if one is. No other member is taken.
      type: object
      additionalProperties: false
      required: [repository, title, mustBeTrue, seen]
      properties:
        repository:
          $ref: '#/components/schemas/Name'
        title:
          type: string
          description: >-
            One line without control characters; the spaces around it are dropped. At most 256 characters, as an
            issue's head holds its title.
          minLength: 1
          maxLength: 256
        mustBeTrue:
          type: string
          description: The paragraph the issue's file opens with.
          minLength: 1
          maxLength: 65536
        size:
          type: string
          enum: [XS, S, M, L, XL]
        worker:
          description: Who works the new issue; AGENT when it is left out.
          allOf:
            - $ref: '#/components/schemas/Worker'
        seen:
          $ref: '#/components/schemas/Seen'
        task:
          description: >-
            The Porelo task that proposed the idea, named in the new issue's file under what must be true; left out
            when no task did. An empty or malformed name is refused, never taken as none.
          allOf:
            - $ref: '#/components/schemas/TaskLabel'
        priority:
          description: The new issue's priority; Medium when it is left out.
          allOf:
            - $ref: '#/components/schemas/Priority'
        story:
          description: The story the new issue is hung into, last in its list; none when it is left out.
          allOf:
            - $ref: '#/components/schemas/StoryId'
        state:
          description: >-
            The requested initial state, or the workflow's first state when left out. The GitHub store checks the
            placement before creating anything and writes it in the create's single save; closed states are refused.
            Other stores create in the first state and then move, answering PartlySaved if that move fails.
          type: string
          minLength: 1
          maxLength: 100
        confirm:
          type: boolean
          default: false
          description: Whether the warnings of the move to state are confirmed, as a batch of moves confirms them.
        labels:
          description: >-
            The new issue's topic labels; none when left out. On GitHub they are written in the create's single save
            and the issue read back, as an edit's labels are.
          allOf:
            - $ref: '#/components/schemas/TopicLabels'
    IssueAdded:
      description: The new issue's id and the board's revision after the save.
      type: object
      required: [id, revision]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        revision:
          $ref: '#/components/schemas/Revision'
    IdeaRequest:
      description: The idea a discussion's task wrote and the discussion's offer; no other member is taken.
      type: object
      additionalProperties: false
      required: [offer, idea]
      properties:
        offer:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The offer of the discussion's task, as the discussion answered it.
        idea:
          $ref: '#/components/schemas/Idea'
    Idea:
      description: >-
        The idea format, as the task's result file holds it and the window hands it on unchanged: one story and an
        issue in each repository it concerns, each repository named once. One line means no control character or
        line break (U+0000 to U+001F, U+007F to U+009F, U+2028, U+2029); the spaces around a title, gain or test are
        dropped, and lengths count code points.
      type: object
      additionalProperties: false
      required: [story, issues]
      properties:
        story:
          $ref: '#/components/schemas/IdeaStory'
        issues:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdeaIssue'
    IdeaStory:
      description: >-
        A new story's title, what a user gains, its test and its priority, saved in the project's own repository; its
        state is the one the request that carries it gives it: the workflow's first state for an idea, its issues' for a story over issues
        that stand.
      type: object
      additionalProperties: false
      required: [title, gain, test, priority]
      properties:
        title:
          type: string
          description: One line.
          minLength: 1
          maxLength: 256
        gain:
          type: string
          description: What a user gains, one line.
          minLength: 1
          maxLength: 400
        test:
          type: string
          description: How a person sees it work, one line.
          minLength: 1
          maxLength: 400
        priority:
          $ref: '#/components/schemas/Priority'
    IdeaIssue:
      description: One issue of the idea, saved in the workflow's first state in its repository.
      type: object
      additionalProperties: false
      required: [repository, title, mustBeTrue, worker]
      properties:
        repository:
          description: One of the project's repositories, named by no other issue of the idea.
          allOf:
            - $ref: '#/components/schemas/Name'
        title:
          type: string
          description: One line.
          minLength: 1
          maxLength: 256
        mustBeTrue:
          type: string
          description: The paragraph the issue's file opens with; not blank.
          minLength: 1
          maxLength: 65536
        size:
          type: string
          enum: [XS, S, M, L, XL]
        worker:
          type: string
          description: Who works the issue, as the person chose it.
          enum: [Agent, Manual]
    StoryRequest:
      description: A new story with its issues, in the idea format, with the versions seen; it has no target. No other member is taken.
      type: object
      additionalProperties: false
      required: [idea, seen]
      properties:
        idea:
          $ref: '#/components/schemas/Idea'
        seen:
          $ref: '#/components/schemas/Seen'
    StoryFromIssuesRequest:
      description: >-
        A new story over issues that stand on the board, with the versions seen; its targets are the issues named,
        and on a retry the story the earlier attempt made. No other member is taken, and no new issue is made.
      type: object
      additionalProperties: false
      required: [story, existing, seen]
      properties:
        story:
          $ref: '#/components/schemas/IdeaStory'
        existing:
          description: The issues the story takes, in its order, each named once.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IssueId'
        seen:
          $ref: '#/components/schemas/Seen'
    StoryAdded:
      description: >-
        The new story's id, its issues' ids - the new ones in the idea's order, or the existing ones in the order
        named - and the board's revision after the save.
      type: object
      required: [id, issues, revision]
      properties:
        id:
          $ref: '#/components/schemas/StoryId'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueId'
        revision:
          $ref: '#/components/schemas/Revision'
    IssueFieldsRequest:
      description: >-
        An issue's fields to set, with the versions seen; its target is the issue. A member left out stays as it is,
        null clears it where the issue may be without it, and no other member is taken.
      type: object
      additionalProperties: false
      required: [seen]
      properties:
        size:
          type: [string, 'null']
          description: The issue's size, XS to XL; null clears it.
          pattern: '^(XS|S|M|L|XL)$'
        estimateMinutes:
          type: [integer, 'null']
          description: The issue's estimate in minutes; null clears it.
          minimum: 1
          maximum: 100000
        priority:
          $ref: '#/components/schemas/Priority'
        rank:
          type: [integer, 'null']
          description: The issue's order within its priority, the lowest first; null clears it.
          minimum: 1
          maximum: 99999
        seen:
          $ref: '#/components/schemas/Seen'
    StoryIssuesRequest:
      description: >-
        A story's whole issue list, in its order, with the versions seen; its targets are the story and every issue
        hung in or taken out. No other member is taken.
      type: object
      additionalProperties: false
      required: [issues, seen]
      properties:
        issues:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/IssueId'
        seen:
          $ref: '#/components/schemas/Seen'
    ListIssueRequest:
      description: >-
        An issue the board offers among its unlisted issues, by its tracker reference, with the versions seen; its
        target is the unlisted issue, by its own version. No other member is taken. A fixed alias or an id of the Git store's form names no such issue and is
        refused (EditNotAllowed, field issue) before the board is read.
      type: object
      additionalProperties: false
      required: [issue, seen]
      properties:
        issue:
          $ref: '#/components/schemas/IssueId'
        seen:
          $ref: '#/components/schemas/Seen'
    BlockedByRequest:
      description: An issue's whole list of blockers, with the versions seen; its target is the issue. No other member is taken.
      type: object
      additionalProperties: false
      required: [blockedBy, seen]
      properties:
        blockedBy:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/IssueId'
        seen:
          $ref: '#/components/schemas/Seen'
    CommentRequest:
      description: A comment's text; no other member is taken.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: The person's text, as they wrote it; not blank, at most 65536 characters.
          minLength: 1
          maxLength: 65536
    IssueTextRequest:
      description: >-
        An issue's title and named parts to write, with the versions seen; its target is the issue. A member left out
        stays as it is, null removes a part where the issue may be without it, and no other member is taken.
      type: object
      additionalProperties: false
      required: [seen]
      properties:
        title:
          type: string
          description: >-
            One line without control characters; the spaces around it are dropped. At most 256 characters, as a
            forge takes an issue's title.
          minLength: 1
          maxLength: 256
        covers:
          type: string
          description: The first paragraph, which says what the issue covers; one paragraph, never removed.
          minLength: 1
          maxLength: 65536
        whyThisSize:
          type: [string, 'null']
          description: The paragraph after the lead Why this size; one paragraph; null removes it.
          minLength: 1
          maxLength: 65536
        whatMustBeTrue:
          type: string
          description: >-
            What must be true, never removed: one paragraph is written after the lead What must be true, a text of
            several paragraphs as the section What must be true.
          minLength: 1
          maxLength: 65536
        plan:
          type: [string, 'null']
          description: The section Plan; null removes it.
          minLength: 1
          maxLength: 65536
        acceptance:
          type: [string, 'null']
          description: The section Acceptance; null removes it.
          minLength: 1
          maxLength: 65536
        openQuestions:
          type: [string, 'null']
          description: The section Open questions; null removes it.
          minLength: 1
          maxLength: 65536
        toBeChecked:
          type: [string, 'null']
          description: The section To be checked; null removes it.
          minLength: 1
          maxLength: 65536
        findings:
          type: [string, 'null']
          description: The section Findings; null removes it.
          minLength: 1
          maxLength: 65536
        labels:
          $ref: '#/components/schemas/TopicLabels'
        seen:
          $ref: '#/components/schemas/Seen'
    StoryTextRequest:
      description: >-
        A story's title and parts to write, with the versions seen; its target is the story. A member left out stays
        as it is, null removes a part, and no other member is taken.
      type: object
      additionalProperties: false
      required: [seen]
      properties:
        title:
          type: string
          description: >-
            One line without control characters; the spaces around it are dropped. At most 256 characters, as a
            forge takes an issue's title.
          minLength: 1
          maxLength: 256
        gain:
          type: [string, 'null']
          description: The paragraph after the lead What a user gains; one paragraph; null removes it.
          minLength: 1
          maxLength: 65536
        test:
          type: [string, 'null']
          description: The paragraph after the lead The test; one paragraph; null removes it.
          minLength: 1
          maxLength: 65536
        labels:
          $ref: '#/components/schemas/TopicLabels'
        seen:
          $ref: '#/components/schemas/Seen'
    EditSaved:
      description: The board's revision after the save.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    IdeaAdded:
      description: The id of the story the offer's idea was saved as.
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/StoryId'

    Refreshed:
      description: The revision after a fetch.
      type: object
      required: [revision]
      properties:
        revision:
          description: The revision, or null for a tracked project that holds no board yet.
          oneOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'

    StoryList:
      description: Stories at one revision.
      type: object
      required: [revision, stories, open]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/Story'
        open:
          description: >-
            What is still open of the whole board: every issue it holds, in a story or not, whatever stories the
            filter answers.
          allOf:
            - $ref: '#/components/schemas/OpenWork'
    OpenWork:
      description: >-
        What is still open of a story or a board. An issue is left to build while it stands neither in a closed state
        nor in the review state: of the states a work rule's work ends in that are neither working nor closed, the one
        latest in the workflow, where the last work ends. An earlier work's end, such as an analysis's, is left to
        build. An issue left to build is blocked while an issue it waits on stands on the board and is not closed; it then counts as blocked,
        not under its state.
      type: object
      required: [states, blocked, sizes, unsized, left, minutes, unestimated, review]
      properties:
        states:
          type: array
          description: >-
            Each state of the workflow, in workflow order, with the number of its issues that are not blocked; zero
            included. An issue in a state the workflow lacks is counted in no state, but in every other figure.
          items:
            $ref: '#/components/schemas/OpenCount'
        blocked:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The issues left to build that an open issue blocks.
        sizes:
          type: array
          description: Each size of the issues left to build, XS to XL, only the sizes that occur.
          items:
            $ref: '#/components/schemas/OpenCount'
        unsized:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The issues left to build without a size.
        left:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The issues left to build, the blocked ones included.
        minutes:
          type: [number, 'null']
          minimum: 0
          description: >-
            The sum of `minutesLeft` over the issues left to build that have it, or null when none has; the issues
            without it are counted in `unestimated`. Summed before rounding, so it may differ from the sum of the
            rounded `minutesLeft` by a fraction.
        unestimated:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The issues left to build without `minutesLeft`.
        review:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The issues in the review state, which wait for the person.
    OpenCount:
      description: A state's or a size's name with its number of issues.
      type: object
      required: [name, issues]
      properties:
        name:
          type: string
        issues:
          type: integer
          minimum: 0
          maximum: 2147483647
    StoryReply:
      description: One story at one revision.
      type: object
      required: [revision, story]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        story:
          $ref: '#/components/schemas/StoryDetail'
    Story:
      description: >-
        One story as the board shows it. Two stories share an id only when each carries the warning IdTwice; neither
        is then worked, moved or edited, and a read of the story by that id answers NoSuchStory.
      type: object
      required: [id, title, state, closedAt, priority, size, link, issues, work, open, warnings, version, labels]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        id:
          $ref: '#/components/schemas/StoryId'
        title:
          type: string
        state:
          type: string
          description: >-
            One of the workflow's states; with a warning about its state, a value the workflow does not know, which
            the board shows in a column of its own at its end named after the value, or empty when no state can be
            told for it (NoState).
        closedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When the story was closed as done, the day its test passed; null while it is open or closed for another
            reason, or where its store keeps no such time.
        priority:
          type: string
        size:
          type: [string, 'null']
          description: >-
            The story's size, XS to XL, given when it was estimated, or null when it has none. It is the story's
            own, never added up from its issues' sizes.
        labels:
          $ref: '#/components/schemas/Labels'
        link:
          type: [string, 'null']
          format: uri
          description: The story's web page, or null when it has none.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        work:
          oneOf:
            - $ref: '#/components/schemas/PlanWork'
            - type: 'null'
          description: The current recorded run, null without a record.
        open:
          oneOf:
            - $ref: '#/components/schemas/OpenWork'
            - type: 'null'
          description: >-
            What is still open of the story's issues and their sub-issues, each counted once. Null when the board does
            not hold every issue the story's head names, or holds one of its ids twice, so nothing is told as if it
            did.
        warnings:
          type: array
          description: >-
            What the store could not read in the story, which the board shows beside it; empty when nothing. The
            story is never left out for it.
          items:
            $ref: '#/components/schemas/ItemWarning'
    StoryDetail:
      description: One story with its description.
      allOf:
        - $ref: '#/components/schemas/Story'
        - type: object
          required: [description, descriptionFormat]
          properties:
            description:
              type: string
              description: The story's text.
            descriptionFormat:
              $ref: '#/components/schemas/TextFormat'

    IssueList:
      description: "Issues at one revision: a story's, or those in no story."
      type: object
      required: [revision, issues]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    IssueReply:
      description: One issue at one revision.
      type: object
      required: [revision, issue]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        issue:
          $ref: '#/components/schemas/IssueDetail'
    Issue:
      description: >-
        One issue on the board. Two issues share an id only when each carries the warning IdTwice; neither is then
        worked, moved or edited, and a read of the issue by that id answers NoSuchIssue.
      type: object
      required: [id, repository, title, state, size, blockedBy, waitsOn, parent, link, worker, atWork, needsYou, readingStopped, noRunHere, attention, minutesLeft, warnings, version, labels]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        id:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        title:
          type: string
        state:
          type: string
          description: >-
            One of the workflow's states; with a warning about its state, a value the workflow does not know, which
            the board shows in a column of its own at its end named after the value.
        size:
          type: [string, 'null']
          description: The issue's size, or null when it has none.
        priority:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: [string, 'null']
          description: >-
            The issue's priority, Highest to Lowest; absent when the store holds none, or one outside them, which the
            issue's warnings then name.
        labels:
          $ref: '#/components/schemas/Labels'
        minutesLeft:
          type: [number, 'null']
          minimum: 0
          description: >-
            For an issue left to build, the minutes expected of it less those its work took so far, never below zero;
            what it took is its Minutes field as the store holds it. Expected is
            its estimate; without one, the median minutes of the finished issues of its size in its
            repository; without those, that median over every repository. Null when it is not left to build or
            nothing gives an expectation.
        blockedBy:
          type: array
          description: The issues of the board blocking it.
          items:
            $ref: '#/components/schemas/IssueId'
        waitsOn:
          type: array
          description: >-
            The issues blocking it that the board does not hold, such as those of a repository outside the project.
            No work is offered for it while any of them, or any of its board blockers, is not done; work already
            started goes on. Empty when there are none.
          items:
            $ref: '#/components/schemas/Wait'
          example:
            - reference: other-org/elsewhere#7
              done: false
              link: https://github.com/other-org/elsewhere/issues/7
            - reference: null
              done: null
              link: null
        parent:
          description: The issue this one is a sub-issue of, or null.
          oneOf:
            - $ref: '#/components/schemas/IssueId'
            - type: 'null'
        link:
          type: [string, 'null']
          format: uri
          description: The issue's web page, or null when it has none.
        worker:
          description: Who works it. A head that names none is worked by an agent; a sub-issue is worked as its parent is.
          allOf:
            - $ref: '#/components/schemas/Worker'
        rounds:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Absent when no reading record is known.
        roundsMost:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: integer
          minimum: 1
          maximum: 2147483647
        atWork:
          type: boolean
        needsYou:
          type: boolean
          description: >-
            Whether the person must act on it: a run of this planner raised it, with the reason in attention. An issue
            a person works, or one with no run here, is never raised.
        readingStopped:
          type: boolean
        noRunHere:
          type: boolean
          description: >-
            Whether an issue an agent works stands in a working state while no run of this planner works it or a story
            holding it now, with a task offered or started, and no run raised it, such as work started elsewhere, set
            by a commit or moved by hand beside a run that ended; it is shown, not raised.
        attention:
          type: string
          enum: [NONE, BLOCKING_FINDINGS, ROUND_LIMIT, UNPUSHED, FAILED, BLOCKED, STOPPED, INVALID_FINDINGS, SAVE_REFUSED, NEXT_STEP_UNAVAILABLE]
          description: >-
            Why the person must act, the reason the run reported; NONE when needsYou is false. INVALID_FINDINGS says a
            reader's findings could not be read: its reading stops, readingStopped true, for Read again or Review anyway.
            FAILED and BLOCKED of a reader stop its reading the same way.
        findings:
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Finding'
        warnings:
          type: array
          description: >-
            What the store could not read in the issue, which the board shows beside it; empty when nothing. The
            issue is never left out for it.
          items:
            $ref: '#/components/schemas/ItemWarning'
    RepositoryWarning:
      description: >-
        What is wrong in one of the project's repositories itself, rather than in a story or an issue: for
        TopicLabels, its labels differ from the topic labels every repository of a project carries - documentation,
        security, tests, build, dependencies, performance and usability, each with its color and description - or
        it still carries one of GitHub's eight default labels. Its own labels, those of neither list, are no part
        of it. It holds back no item and no work.
      type: object
      required: [repository, kind, missing, defaults, differing, correction]
      properties:
        repository:
          $ref: '#/components/schemas/Name'
        kind:
          type: string
          pattern: '^[A-Z][A-Za-z]{0,63}$'
          description: >-
            An open name of what is wrong; a window shows a kind it does not know with its repository alone. The
            known kind is TopicLabels.
        missing:
          type: array
          maxItems: 7
          description: The topic labels the repository lacks, in the topic labels' order.
          items:
            $ref: '#/components/schemas/LabelName'
        defaults:
          type: array
          maxItems: 8
          description: GitHub's default labels the repository still carries, in GitHub's order.
          items:
            $ref: '#/components/schemas/LabelName'
        differing:
          type: array
          maxItems: 7
          description: >-
            The topic labels the repository carries with another color or description, in the topic labels' order.
          items:
            $ref: '#/components/schemas/LabelName'
        correction:
          description: >-
            The change the store offers to set the repository right, a Labels with no choices, or null when it
            offers none.
          oneOf:
            - $ref: '#/components/schemas/Correction'
            - type: 'null'
    LabelCall:
      description: >-
        One call a repository's Labels correction makes on its forge: Delete a default label, which also takes it off
        every issue of the repository that carries it, Create a missing topic label, or Update a topic label's color
        and description to the topic labels'.
      type: object
      required: [action, label, color, description]
      properties:
        action:
          type: string
          enum: [Delete, Create, Update]
        label:
          $ref: '#/components/schemas/LabelName'
        color:
          description: The color it is written with, six lower-case hexadecimal digits; null for a Delete.
          oneOf:
            - type: string
              pattern: '^[0-9a-f]{6}$'
            - type: 'null'
        description:
          description: The description it is written with, at most 100 characters; null for a Delete.
          oneOf:
            - type: string
              maxLength: 100
            - type: 'null'
    ItemWarning:
      description: >-
        What a store could not read in a story or an issue it still shows. A warning about the item's state, parent,
        blockers, id, kind, worker or risk holds it back, and every issue under it at any depth: no work starts on
        them, no edit changes them or adds them to a story or as a blocker or takes them out, and no move names them. A
        warning about the state alone still lets the item move, since a move into a state of the workflow sets it right,
        and lets each issue under it move too; so does the correction a store offers for it.
      type: object
      required: [kind, text, holds, correction]
      properties:
        kind:
          type: string
          pattern: '^[A-Z][A-Za-z]{0,63}$'
          description: >-
            An open name of what is wrong; a window shows a kind it does not know as any other. Known kinds are
            StateOutsideWorkflow, NoState, NoPriority, IdTwice, ParentOutsideProject, BlockerOutsideProject,
            IssueOutsideProject, WrongParent, BodyNotSectioned, StoryOutsideOwnRepository, ParentInOtherRepository,
            BlockedByStory, ParentCircle, SubIssueOfSubIssue, PastOnePage, DependsOnUnplaced, UnknownWorker,
            UnknownRisk, StoryUnderIssue, AlsoNeedsNotOnBoard, BodyTooLong, UnknownSize, UnknownPriority,
            UnreadableNumber, IssueBehindStory, UnknownLabel. IssueBehindStory is a story's: its words name each of
            its issues that stands before the state its issues give it, such as an issue in Idea in a story being
            implemented; it holds nothing back. UnknownLabel is a local item's whose file names a label outside the
            topic labels, as a hand edit of the file may; the label is shown and kept, and it holds nothing back.
        text:
          type: string
          description: >-
            Words saying what is wrong, for a tooltip, shown as plain text. They are fixed but for the places a
            store names: where a store sets nothing right itself, they name where the item is kept, so the person
            sets it right by hand there. The Git store names each copy's file and repository for IdTwice, and the
            story's for IssueOutsideProject; a file's path is relative to its repository and may hold a person's
            words, so it is named without control, format, bidi or zero-width characters and capped at 200
            characters with an ellipsis.
        holds:
          type: boolean
          description: >-
            Whether the planner holds back the item for this warning: no work starts on it, and neither an edit nor
            a move names it, but for a move out of a state the workflow does not know. Since kinds are open, a window
            tells by this field which warning holds an item.
        correction:
          description: >-
            The one change the store offers to set the warning right, or null when it offers none: the store decides
            it when it reads the board, and offers none while another warning holds the item back or the work rules
            have faults. The Git store offers a Move for an issue's StateOutsideWorkflow alone; the GitHub store
            offers the same Move, and a Priority for a story's NoPriority and UnknownPriority with the priorities the
            organization's issue field Priority holds; none when the owner has no such field or it could not be read.
          oneOf:
            - $ref: '#/components/schemas/Correction'
            - type: 'null'
    Correction:
      description: >-
        The one change that sets a warning right, which the person picks and confirms on the board.
      type: object
      required: [kind, choices]
      properties:
        kind:
          type: string
          pattern: '^[A-Z][A-Za-z]{0,63}$'
          description: >-
            An open name of the change; a window offers a kind it does not know as none. Known kinds are Move - the
            issue moved into the state picked, previewed and saved through /moves/preview and /moves as any move of
            it -, Priority - the story's priority set to the one picked, previewed and saved through
            /corrections/preview and /corrections - and Labels - a repository's labels brought to the topic labels,
            previewed and saved through /corrections/preview and /corrections.
        choices:
          type: array
          maxItems: 64
          description: >-
            What the person picks from, each a name a request sends back as its `choice`; a state whose name is
            none such is not offered. At least one for every kind but a Labels, which offers none and has it empty.
            For a Move, the states in the workflow's order: its open states that no work alone enters, so a
            correction neither closes the item nor starts work on it. They are what the window offers: a Move is
            judged as any move by /moves, which may move the issue into any state of the workflow, a closed one too.
            For a Priority, the priorities the store can hold, the highest first, each one of Highest, High, Medium,
            Low and Lowest.
          items:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9 _-]{0,63}$'
    CorrectionRequest:
      description: >-
        The correction of one warning on one story, issue or repository, with what the person picked, previewed
        against the board as the planner reads it; it names exactly one story, one issue or one repository and
        carries no versions.
      type: object
      required: [warning]
      properties:
        story:
          $ref: '#/components/schemas/StoryId'
        issue:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        warning:
          type: string
          pattern: '^[A-Z][A-Za-z]{0,63}$'
          description: The kind of the warning it sets right.
        choice:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9 _-]{0,63}$'
          description: >-
            What the person picked among the correction's `choices`: a state's name for a Move, a priority for a
            Priority; left out for a Labels, which offers none. The planner checks it against the choices it offers
            and refuses any other, and a missing one, (CorrectionRefused).
    CorrectionConfirm:
      description: >-
        A correction the person confirmed, with the digest of its preview and the versions seen, its preview's
        targets; it names exactly one story, one issue or one repository. A repository's has no targets and sends
        `seen` as exactly `{}`.
      type: object
      required: [seen, warning, digest]
      properties:
        seen:
          $ref: '#/components/schemas/Seen'
        story:
          $ref: '#/components/schemas/StoryId'
        issue:
          $ref: '#/components/schemas/IssueId'
        repository:
          $ref: '#/components/schemas/Name'
        warning:
          type: string
          pattern: '^[A-Z][A-Za-z]{0,63}$'
        choice:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9 _-]{0,63}$'
          description: What the person picked, as its preview was asked with; left out for a Labels.
        digest:
          $ref: '#/components/schemas/PreviewDigest'
    CorrectionPreview:
      description: What a correction would write, and the digest its save sends back.
      type: object
      required: [revision, digest, story, issue, repository, warning, from, to, calls, targets]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        digest:
          $ref: '#/components/schemas/PreviewDigest'
        targets:
          type: array
          description: >-
            Every item the correction changes, each once with the version it stands at. The save sends them back in
            `seen`. Empty for a Labels, which changes no item.
          items:
            $ref: '#/components/schemas/Target'
        story:
          description: The story it writes, or null.
          oneOf:
            - $ref: '#/components/schemas/StoryId'
            - type: 'null'
        issue:
          description: The issue it writes, or null.
          oneOf:
            - $ref: '#/components/schemas/IssueId'
            - type: 'null'
        repository:
          description: The repository whose labels it writes, or null.
          oneOf:
            - $ref: '#/components/schemas/Name'
            - type: 'null'
        warning:
          type: string
          description: The kind of the warning it sets right.
        from:
          type: string
          description: >-
            What the item holds now of what the correction changes, empty when none is told; a Priority's warning
            tells none, so it is empty for one, and so is a Labels', whose calls say what changes.
        to:
          type: string
          description: What it is written with, the choice picked; empty for a Labels, which its calls say.
        calls:
          type: array
          maxItems: 15
          description: >-
            For a Labels, every call it makes on the repository's forge, in the order it makes them: each default
            label deleted, then each missing topic label created, then each differing one updated, each in its
            list's order; the repository's own labels are never named. Empty for every other kind.
          items:
            $ref: '#/components/schemas/LabelCall'
    CorrectionSaved:
      description: >-
        The board's revision after a correction was saved; a correction never writes a state, so it stops no run.
      type: object
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
    HeldIssue:
      description: An open issue of the story no task of the proposal names, since the board holds it back.
      type: object
      required: [issue, reason]
      properties:
        issue:
          $ref: '#/components/schemas/IssueId'
        reason:
          type: string
          description: >-
            Why, in the words of its warnings, of its id that names two issues, of the blockers it waits on, or of a
            held parent above it, named as "it stands under" the parent followed by the parent's own reason.
    Wait:
      description: An issue an issue of the board waits on that the board does not hold.
      type: object
