    post:
      operationId: saveMoves
      summary: Save moves, all or none
      description: >-
        Checks a batch of moves against the versions `seen` holds for its targets, the preview's `targets`, and the
        rules against the board as it stands, and saves it all or not at all: each
        repository it changes gets one commit in the planner's own clone of it. The answer means every commit stands
        in those clones; the pushes, under the person's own Git login, follow in the background, the other
        repositories before the project's own, and a push that fails becomes a fault on the board. A story moves its least
        advanced issues, but a story moved to the completed state (closed, not Rejected) takes no issue along and is
        refused (MoveNotAllowed) unless each of its issues stands in Review, the state the last work leads to, or
        closed after the batch; a working state is entered only by work, except by an issue a person works (worker
        MANUAL), which a person moves into and through the working states by hand, and by an issue an agent works
        while no run in this planner's record works it or a story holding it, which then reads noRunHere as work
        started elsewhere; a story enters one only by its work. The body carries the digest of
        the batch's preview: under the writer lock, before anything is written, the preview is computed again, and a
        batch whose preview answers another digest is refused (PreviewChanged), so a confirmation counts only for the
        batch, the repository and the work the person was shown. A batch over running work - a story it moves or moves an
        issue of whose run has a task at work, or an issue such a task works - is refused (WorkRunning) unless it is
        confirmed; a confirmed one stops, after its digest matched and in the same step as its save,
        each run with tasks at work over what moves, as the story's Stop does, and answers those runs with the tasks
        the window must end, so nothing is stopped that the preview did not show. A move's `reason` is not part of the
        digest; on a store that keeps reasons (the workflow's `reasons`) it is written as a comment, after the item
        is closed, on the story whose shown state the move makes its closed state and on each issue the move closes,
        and once only, so the same move sent again after a save that failed in its comments writes what is missing.
      tags: [board]
      requestBody:
        required: true
