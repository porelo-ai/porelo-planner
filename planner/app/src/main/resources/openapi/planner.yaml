        done:
          type: [boolean, 'null']
          description: Whether it is done; null when it could not be read, which holds the issue back as not done.
        link:
          type: [string, 'null']
          format: uri
          description: Where a person reads it on the tracker, or null when not known.

    IssueDetail:
      description: One issue with its text and sub-issues.
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [text, textFormat, subIssues]
          properties:
            text:
              type: string
              description: The issue's text.
            textFormat:
              $ref: '#/components/schemas/TextFormat'
            subIssues:
              type: array
              items:
                $ref: '#/components/schemas/IssueId'
            whatMustBeTrue:
              x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
              type: string
              description: The issue's What must be true paragraph; absent when the text has none.

    StoryWorkProposalRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          description: A state named by the workflow.
        issues:
          $ref: '#/components/schemas/ChosenIssues'
    ChosenIssues:
      type: array
      minItems: 1
      maxItems: 1000
      uniqueItems: true
