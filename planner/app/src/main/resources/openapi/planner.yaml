          items:
            $ref: '#/components/schemas/HeldIssue'
    PlanRepositoryWork:
      type: object
      additionalProperties: false
      required: [repository, issues, main, subAgents]
      properties:
        repository:
          $ref: '#/components/schemas/Name'
        issues:
