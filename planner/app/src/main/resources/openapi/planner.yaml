openapi: 3.1.0
info:
  title: Porelo Planner
  version: 1.0.0
  description: >-
    Serves a project's planning board - its workflow, stories and issues kept in Git - to the Porelo window on the
    same computer. No call carries the planner's token. Every call but the proof is signed in its Porelo-Signature
    header with an HMAC-SHA256 under the token's UTF-8 bytes; a request without one valid signature, with two, or with
    an Authorization header answers 401 with an empty body, and so does one whose body is larger than 267264 bytes,
    the longest title and body GitHub takes with their JSON, 1048576 bytes for POST /projects/{project}/ideas,
    /projects/{project}/stories and /projects/{project}/issues, or 1052672 bytes for POST
    /projects/{project}/tasks/{task}/result.
    The signature is `porelo-planner-request-1;t=<time>;n=<nonce>;s=<hmac>`: the UTC time in seconds in decimal, no
    leading zero, at most 60 s off the planner's clock; 16 random bytes as nonce, each taken once; the HMAC over the
    ASCII label porelo-planner-request-1 and one zero byte, then each of these fields as its length in four bytes,
    big endian, and its bytes - the method, the raw request target as sent (the path and, when there is one, `?` and
    the raw query), the Host header, the Content-Type header (empty when absent), the SHA-256 of the body as sent
    (of no bytes when absent), the time as in the header and the nonce. Nonce and HMAC are base64url without
    padding, in their one canonical form. Every answer to a signed request but its 401 carries
    `Porelo-Answer: porelo-planner-answer-1;s=<hmac>`, the HMAC under the token over the label
    porelo-planner-answer-1 and one zero byte, then as length-prefixed fields the request's nonce, the status in
    decimal and the SHA-256 of the answer's body; the opening of the changes stream carries it with an empty field in
    place of the body's digest, and its events are not part of it. Before its first call, and again after a
    connection error, a timeout, a stream it opens again, a 401 or a change of the address file, a caller asks POST
    /proof that the planner on the port holds the token, and calls nothing when the answer is not the proof.
servers:
  - url: http://127.0.0.1
security:
  - signature: []

paths:
  /proof:
    post:
      operationId: proveToken
      summary: Proof of the token
      description: >-
        Proves that the planner listening on this port holds the token, without a signature and before anything of
        the person's is sent: the proof is the HMAC-SHA256 under the token's UTF-8 bytes over the ASCII label
        porelo-planner-proof-1, one zero byte, the port the planner listens on as two bytes, big endian, and the 32
        challenge bytes, in base64url without padding. Only POST on the raw path /proof, without a query, is exempt
        from the signature. The body is application/json of at most 128 bytes, an object with exactly the one member
        challenge; anything else answers 400 with an empty body, and no refused proof is logged.
      tags: [health]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofRequest'
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proof'
        '400':
          description: The body is not one canonical challenge; the body is empty.
  /health:
    get:
      operationId: getHealth
      summary: Health
      description: >-
        Answers UP while the planner serves calls, with the planner's version and the commit it was built from.
      tags: [health]
      responses:
        '200':
          description: The planner serves calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /log/level:
    get:
      operationId: getLogLevel
      summary: The log's level
      description: >-
        Answers the level of the planner's own log in force. Where the log lies is the address file's `log` field.
      tags: [log]
      responses:
        '200':
          description: The level in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putLogLevel
      summary: Set the log's level
      description: >-
        Sets the level of the planner's own log at once and keeps it, so it holds from the next start too. The
        planner's log takes only its own lines; a library's stay out of it at every level.
      tags: [log]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Level'
      responses:
        '200':
          description: The level now in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
        '400':
          $ref: '#/components/responses/InvalidLevel'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mock/reset:
    post:
      operationId: resetMock
      summary: Restore the mock board
      description: >-
        Only in the mock mode (`porelo-planner --mock`), for the window's tests: forgets every project given with the
        moves saved into its own copy of the mock board, so a project given again is served the mock board at
        `mock@1` and each test starts alike. Outside the mock mode a POST here
        answers 404, as for a path that does not exist.
      tags: [mock]
      responses:
        '204':
          description: The mock board is as it was at the start.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The planner does not run in the mock mode.

  /projects/{project}:
    parameters:
      - $ref: '#/components/parameters/Project'
    put:
      operationId: putProject
      summary: Name a project's repository
      description: >-
        Makes the project known with its own repository and branch; the same body again changes nothing. Another body
        retires the project first and drops its clones as the new one opens, so a failed call leaves the project
        unknown.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSource'
      responses:
        '204':
          description: The project is known with this repository and branch.
        '400':
          $ref: '#/components/responses/ProjectRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/workflow:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getWorkflow
      summary: Read the workflow
      description: >-
        Answers the project's states, phases, sound work rules, the faults found reading its workflow and board, and
        where its stories and issues are kept.
      tags: [board]
      responses:
        '200':
          description: The project's workflow at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/events:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: getEvents
      summary: Follow the board's changes
      description: >-
        Streams the project's board as Server-Sent Events: event `board`, its `id` the board's revision and its
        `data` one `Board` object, first at once and then whenever the store revision or local work generation changes. Work-only
        changes retain the revision, including a cancellation or Needs you. Saves, polls and `refresh` publish the
        current board and work snapshot. A comment line `: keep-alive` comes every 15 s while nothing changes; a
        reader that falls behind gets only the newest board. A reconnect, with `Last-Event-ID` or without, gets the
        current board first. An unknown project is refused before the stream starts. While the store reads the board,
        whole or by a look, event `load` tells the read's progress at least every 5 s, its `data` `{"state":
        "reading", "since", "read", "total", "lastRead", "from", "kind", "waitsFor"}`. `kind` is `whole` (also when it
        is absent) for a read of the whole board, item by item, a `refresh` told so from the moment it is asked, even
        while it waits behind a look; or `look` for a look at the board's item list for what changed since the board
        held, whose `read` counts the items its list showed so far and whose `total` is the larger of the items the
        board holds and those listed so far. `waitsFor` is `save` while the read told waits for the project a save or
        comment of the planner holds, and absent otherwise. A reader ignores a `kind` or `waitsFor` it does not know:
        an unknown `kind` counts as `whole`, an unknown `waitsFor` as absent. A read ends with its `board`, with
        `load` `{"state": "done"}` when it
        changed nothing, or with `load` `{"state": "failed", "problem", "failure", "parameters"}`: before the first
        board this ends the stream, after it the stream stays and the board held stands. A local project's kept
        directory the planner can no longer use fails its read with problem ItemsDirectoryRefused, `failure` its
        phrase and `parameters` naming the directory as that refusal does, only when it is an ItemsDirectory; no
        board is read meanwhile, from the default directory neither.
      tags: [board]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last event id the window saw; the current board comes first in any case.
          schema:
            type: string
      responses:
        '200':
          description: The stream of the project's boards; each event's data is a `Board`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/refresh:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: refreshProject
      summary: Read the repositories now
      description: >-
        Reads the project at once instead of waiting for the next poll. For a project kept in Git, the repositories
        are fetched and a new revision reaches every stream of the project before this call answers; a repository
        whose save is still pending is not fetched: it stands as the planner's own clone holds it until the save is
        pushed. For a tracked project, it answers at once, before its first board too, and the read's board
        follows on the stream, with `load` events while the read runs and a failed `load` when it fails.
      tags: [board]
      responses:
        '200':
          description: >-
            The revision after the fetch for a project kept in Git; the revision held when the read began for a
            tracked project, null while it holds no board yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refreshed'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listStories
      summary: List the stories
      description: Answers the project's stories with their issues, all of them or only those in the named states.
      tags: [board]
      parameters:
        - name: state
          in: query
          required: false
          description: A state whose stories are answered; repeated for several, and absent for all stories.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The stories at the given revision, without their descriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryList'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'
    post:
      operationId: createStory
      summary: Make a story with new issues, or from issues that stand
      description: >-
        Makes a story in the project's own repository in one of two ways, told apart by the body's members. A
        StoryRequest saves an idea a person, or an agent acting for them, wrote without a discussion: one story in
        the workflow's first state and an issue in that state in each repository the idea names, in one save, as a
        discussion's hand-in is saved; it changes no item that stands, so its `seen` may be empty and is not checked.
        The idea is checked against the idea format before
        anything is saved, and a malformed idea makes nothing (IdeaRefused). A save that stops after a part of it
        stands answers PartlySaved, naming the repositories that hold their part; a run whose story is gone is dropped
        first, so the new story never takes it over. A StoryFromIssuesRequest makes a story over issues that stand on
        the board: each must be an open issue of the workflow, no story and no sub-issue, and is refused otherwise,
        each refused id named in the IdeaRefused answer; an issue another story holds is a conflict (IssueInStory,
        naming the first such issue, the story holding it and the field that named it), told once the body has no
        other fault. The issues become the story's issues in the order named and keep their own fields, and the
        story's state follows theirs. Every issue named is a target: it is checked against the version `seen` holds
        for it, read again from the tracker where the store keeps one, before anything is written; an issue changed
        since is ItemChanged, one without a version BasisIncomplete, and one hung under another parent there is
        IssueInStory, with nothing made. The story's body
        ends in a hidden HTML comment marking the request, a digest of its title, gain, test and the issues named. A
        save that stops after the story was made answers PartlySaved; after reading the board again, the same story
        and issues sent with the versions the new board shows, the story the earlier attempt made among them, finish
        it: the story carrying that request's mark, made by the same
        person within a day and holding no issue but those named, is taken, never made twice, an issue it already
        holds is not linked again, and it keeps the priority it holds. A story a person made, or one another request
        made, is never taken. A store that makes no story from issues that stand, such as the Git store, answers
        NotOffered before the body is checked. A run whose story is gone is dropped once the new story stands, so a
        refused call leaves the work record as it was; a gone story's run with a task still at work refuses the call,
        as does a started task that works one of the issues named or a sub-issue of one (WorkRunning, naming that
        issue). A StoryRequest JSON body is at most 1048576 bytes; a StoryFromIssuesRequest body is at most
        65536 bytes. The changes stream announces the new board as it does after any
        save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StoryRequest'
                - $ref: '#/components/schemas/StoryFromIssuesRequest'
      responses:
        '201':
          description: The story is saved, with its issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryAdded'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/IdeaRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: getStory
      summary: Read one story
      description: >-
        Answers one story with its issues and its description. An id two stories share answers NoSuchStory, since
        no one story is meant.
      tags: [board]
      responses:
        '200':
          description: The story at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryReply'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/issues:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    get:
      operationId: listStoryIssues
      summary: List a story's issues
      description: Answers exactly the issues of one story.
      tags: [board]
      responses:
        '200':
          description: The story's issues at the given revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '503':
          $ref: '#/components/responses/RecordUnavailable'
        '504':
          $ref: '#/components/responses/Unreachable'
    put:
      operationId: setStoryIssues
      summary: Set a story's issues
      description: >-
        Writes the story's whole issue list, in its order, checked against the versions `seen` holds for the story and
        for every issue hung in or taken out, whose parent changes: an issue taken out
        is no longer the story's, an issue hung in becomes the story's, and the order is the one sent. Each issue is
        named once and is one of the board's; an issue that is a sub-issue of another issue, or that another story
        holds, is refused (EditNotAllowed), since an issue belongs to one story; so is a list for a story the board
        shows only in part, since a list written whole would drop the issue not shown, and a list that hangs in or
        takes out an issue a warning holds back; one kept in the list may be reordered. An issue a started task works,
        or one of its sub-issues, is not taken out (WorkRunning). On GitHub an issue becomes the story's sub-issue,
        and one the story's body names under Also needs keeps its place after the sub-issues and is not taken out by
        this call. A list equal to the story's saves nothing and answers the current revision. The JSON body is at most 65536 bytes. The changes stream announces
        the new board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIssuesRequest'
      responses:
        '200':
          description: The list is saved, or was the story's already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSaved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchItem'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/EditRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/stories/{story}/text:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Story'
    put:
      operationId: setStoryText
      summary: Set a story's title and text
      description: >-
        Writes the story's title and its parts What a user gains and The test, every other byte of its text as it
        was. A member left out stays as it is; null removes the part with its lead, and the title is never removed.
        Also needs (the story's issues, set through its issues), a person's own headings and the fields are not
        written by this call; a member naming them is
        refused (EditNotAllowed), and a body naming nothing is refused. The member labels sets the item's topic
        labels (TopicLabels): a label outside them that the item carries stays, and a name outside them is refused
        (LabelNotAllowed) before anything is written. The Git store sets no labels (NotOffered). On GitHub the item is
        read back after the write, since GitHub drops labels without an error for an account that may not set them;
        labels it carries other than every label sent - the topic labels asked and those of the person's own it
        carried - are refused (LabelsNotKept, naming the repository and the item), never answered as saved, while
        what else the edit wrote stands and the changes stream announces it. GitHub matches a label's name in any
        case, so a label it carries as Tests is the topic label tests: it counts as carried, is taken off when left
        out, and is never sent beside tests. A topic label the repository lacks is created by GitHub for the write in
        its own grey without a description and stays so: the next Refresh shows it as differing in the repository's
        warning, whose Labels correction sets it right. A text and labels equal to the item's save nothing and answer the current revision. The edit is checked against the version `seen` holds for the item, and on GitHub
        the item is read again right before the write and the edit refused (ItemChanged, naming the item) when a
        person changed it since; GitHub takes no condition on an issue's update, so a change made in the one round trip
        between that read and the write is overwritten, and stays in GitHub's own history of the item. A part whose
        text holds a line Markdown reads as a heading of the first or second level, a lead of another leading part, a
        blank line in a leading part, a code block, an HTML comment, a pre or a details block left open, or a text
        that would grow the body past the 65536 characters GitHub takes, is refused (EditNotAllowed) before anything
        is written; so is a body whose sections cannot be told apart for certain, with the first thing to repair. The
        JSON body is at most 267264 bytes. The changes stream announces the new board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryTextRequest'
      responses:
        '200':
          description: The text is saved, or held it already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSaved'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchStory'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/EditRefused'
        '501':
          $ref: '#/components/responses/NotOffered'
        '502':
          $ref: '#/components/responses/SaveRefused'
        '503':
          $ref: '#/components/responses/Busy'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/ideas/discussion:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: discussIdea
      summary: Offer a task that discusses an idea
      description: >-
        Answers one task for Porelo's Start that discusses an idea with the person: role DISCUSSION, no repository,
        no issues, mode AGENT, and as agent and model the first agent and model of the first sound work rule whose
        names are 1 to 128 UTF-16 code units, as defaults the person may change. The window starts it with every
        repository of the project read only, and the task hands back the file named by result, in the idea format
        the brief carries. Records, saves and announces nothing, and no task events are taken for its offer. The
        JSON body is at most 65536 bytes; the idea is 1 to 4000 characters and not blank, else InvalidSettings.
        NoDiscussion (reason) when no sound work rule offers an agent or the brief would exceed 65536 UTF-8 bytes.
      tags: [work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaDiscussionRequest'
      responses:
        '200':
          description: The one task to pass to Porelo's Start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningStartTask'
        '400':
          $ref: '#/components/responses/WorkRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '502':
          $ref: '#/components/responses/StoreRefused'
        '504':
          $ref: '#/components/responses/Unreachable'

  /projects/{project}/ideas:
    parameters:
      - $ref: '#/components/parameters/Project'
    post:
      operationId: handIdea
      summary: Hand in the idea a discussion wrote
      description: >-
        Saves the idea a discussion's task wrote, which the window hands in with the discussion's offer when the task
        ends: one story in the workflow's first state in the project's own repository and an issue in that state in each repository the
        idea names, in one save against the board the planner reads; the request carries no versions. The idea is
        checked before anything is saved, and a malformed idea makes nothing. One offer makes one story: a second
        hand-in of a saved offer answers the same story and writes nothing, even for another idea; a hand-in of an
        offer whose save is still pending or was only partly pushed is refused (IdeaRefused, naming the repositories
        already pushed) and writes nothing. The JSON body is at most 1048576 bytes. The changes stream announces the new
        board as it does after any save.
      tags: [board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaRequest'
      responses:
        '201':
          description: The story and its issues are saved, by this hand-in or an earlier one of the same offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaAdded'
        '400':
          $ref: '#/components/responses/InvalidName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoSuchProject'
        '409':
          $ref: '#/components/responses/ItemsDirectoryRefused'
        '422':
          $ref: '#/components/responses/IdeaRefused'
        '501':
