spring.application.name=porelo-planner
# Only this computer reaches the planner.
server.address=127.0.0.1
spring.main.banner-mode=off
# The system chooses the port; the window reads it from the address file.
server.port=0
# The level is the planner's own: Spring's and Tomcat's loggers at DEBUG could write a call's
# Authorization header, so they stay at INFO and never reach the planner's log file.
logging.level.root=INFO
logging.level.org.fuin.porelo.planner=INFO
# The log file's bound: the newest 10 MB and three older files of as much.
planner.log.max-file-size=10MB
planner.log.max-history=3
